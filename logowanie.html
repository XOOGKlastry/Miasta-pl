<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Konto — PolskoZnawca</title><meta name="theme-color" content="#e8efdf"><link rel="stylesheet" href="konto-ui.css?v=1"><main class="account-main"><div class="brand"><svg viewBox="0 0 50 50" aria-hidden="true"><defs><clipPath id="ball"><circle cx="25" cy="25" r="21"/></clipPath></defs><g clip-path="url(#ball)"><path d="M0 0H50V25H0Z" fill="#fff"/><path d="M0 25H50V50H0Z" fill="#dd4547"/></g><circle cx="25" cy="25" r="21" fill="none" stroke="#31533d" stroke-width="2"/><ellipse cx="18" cy="21" rx="3" ry="4" fill="#243b2b"/><ellipse cx="32" cy="21" rx="3" ry="4" fill="#243b2b"/></svg>PolskoZnawca</div><nav class="account-nav"><a href="./">⌂ Plansza</a><a href="ranking.html">🏆 Ranking</a><a href="logowanie.html" aria-current="page">● Konto</a></nav><h1>Twoje konto</h1><p>Twoja przygoda z Polską zaczyna się tutaj. Wybierz sposób logowania.</p><div id="auth-options"><button id="google"><svg class="provider-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.6 12.2c0-.7-.1-1.4-.2-2.2H12v4.2h5.4a4.6 4.6 0 0 1-2 3v2.6h3.4c2-1.8 2.8-4.5 2.8-7.6Z"/><path fill="#34A853" d="M12 22c2.7 0 5-.9 6.8-2.5l-3.4-2.6c-.9.6-2 1-3.4 1-2.6 0-4.9-1.8-5.7-4.2H2.8v2.7A10.2 10.2 0 0 0 12 22Z"/><path fill="#FBBC05" d="M6.3 13.7a6.1 6.1 0 0 1 0-3.4V7.6H2.8a10 10 0 0 0 0 8.8l3.5-2.7Z"/><path fill="#EA4335" d="M12 6.1c1.5 0 2.7.5 3.8 1.5L19 4.4A9.7 9.7 0 0 0 12 2a10.2 10.2 0 0 0-9.2 5.6l3.5 2.7C7.1 7.9 9.4 6.1 12 6.1Z"/></svg>Kontynuuj z Google</button><button id="facebook"><span class="provider-icon facebook" aria-hidden="true">f</span>Kontynuuj z Facebook</button><div class="divider">lub użyj e-maila</div><form id="mail"><label>E-mail<input id="email" type="email" autocomplete="email" required></label><button>Wyślij kod na e-mail</button></form><form id="otp" hidden><label>Kod z wiadomości<input id="code" inputmode="numeric" autocomplete="one-time-code" required></label><button>Potwierdź kod</button></form></div><p class="privacy">Tylko podstawowe dane konta. W rankingu możesz pokazać wybrany pseudonim — Twój e-mail pozostaje prywatny.</p><p id="status" role="status" aria-live="polite"></p><button id="logout" hidden>Wyloguj</button><a class="back-link" href="./">← Wróć do gry</a></main><script src="online-config.js"></script><script src="online.js?v=5"></script><script>
const status=document.getElementById('status');let email;
async function run(fn){const active=[...document.querySelectorAll('button:not(:disabled)')];active.forEach(b=>b.disabled=true);try{await fn();}catch(e){status.textContent=e.message;}finally{active.forEach(b=>{if(!b.dataset.unavailable)b.disabled=false;});}}
async function back(){const s=await Online.session();if(!s)return;const ret=sessionStorage.getItem('login-return');sessionStorage.removeItem('login-return');if(ret&&ret.startsWith('/')&&!ret.startsWith('//'))location.replace(ret);else{status.textContent='Jesteś zalogowany. Możesz wrócić do gry.';document.getElementById('logout').hidden=false;document.getElementById('auth-options').hidden=true;}}
if(!Online.enabled()){status.textContent='Logowanie jest w przygotowaniu. Możesz teraz grać na tym urządzeniu.';document.querySelectorAll('button').forEach(b=>b.disabled=true);}else run(async()=>{await Online.callback();await back();const providers=await Online.providers();if(!window.ONLINE_CONFIG.emailReady){document.querySelectorAll('#mail button,#otp button').forEach(b=>{b.disabled=true;b.dataset.unavailable='1';});}for(const p of ['google','facebook']){document.getElementById(p).disabled=!providers[p];if(!providers[p])document.getElementById(p).dataset.unavailable='1';if(!providers[p])document.getElementById(p).title='Dostawca wymaga aktywacji w Supabase';}if(!(await Online.session())&&(!providers.google||!providers.facebook))status.textContent=window.ONLINE_CONFIG.emailReady?'E-mail jest dostępny. Google i Facebook oczekują na aktywację dostawców.':'Serwer kont jest podłączony. Metody logowania czekają na dokończenie konfiguracji.';});
for(const p of ['google','facebook'])document.getElementById(p).onclick=()=>run(()=>Online.oauth(p));
document.getElementById('mail').onsubmit=e=>{e.preventDefault();run(async()=>{email=document.getElementById('email').value;await Online.email(email);document.getElementById('otp').hidden=false;status.textContent='Sprawdź e-mail i wpisz otrzymany kod.';});};
document.getElementById('otp').onsubmit=e=>{e.preventDefault();run(async()=>{await Online.verify(email,document.getElementById('code').value);await back();});};
document.getElementById('logout').onclick=()=>run(async()=>{await Online.logout();location.reload();});
</script></html>
