<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Konto — PolskoZnawca</title><link rel="stylesheet" href="wspolne.css?v=21"><style>main{max-width:430px;margin:40px auto;padding:24px;background:#fff8e7;border-radius:24px}button,input,a{display:block;margin:12px 0;padding:14px;width:100%;box-sizing:border-box;border-radius:14px;border:1px solid #7c9f80;font:inherit}button{background:#d6ebcd;cursor:pointer}input{background:white}p{line-height:1.5}#status{min-height:48px}</style><main><h1>Witaj w grze!</h1><p>Załóż konto lub zaloguj się. Wybierz e-mail, Google albo Facebook.</p><button id="google">Kontynuuj z Google</button><button id="facebook">Kontynuuj z Facebook</button><form id="mail"><label>E-mail<input id="email" type="email" autocomplete="email" required></label><button>Wyślij kod na e-mail</button></form><form id="otp" hidden><label>Kod z wiadomości<input id="code" inputmode="numeric" autocomplete="one-time-code" required></label><button>Potwierdź kod</button></form><p>Nie potrzebujemy kontaktów ani dostępu do publikowania. W rankingu pokazujemy tylko wybrany pseudonim i wyniki.</p><p id="status" role="status" aria-live="polite"></p><button id="logout" hidden>Wyloguj</button><a href="./">Wróć do gry</a></main><script src="online-config.js"></script><script src="online.js"></script><script>
const status=document.getElementById('status');let email;
async function run(fn){try{await fn();}catch(e){status.textContent=e.message;}}
async function back(){const s=await Online.session();if(!s)return;const ret=sessionStorage.getItem('login-return');sessionStorage.removeItem('login-return');if(ret&&ret.startsWith('/')&&!ret.startsWith('//'))location.replace(ret);else{status.textContent='Jesteś zalogowany. Możesz wrócić do gry.';document.getElementById('logout').hidden=false;}}
if(!Online.enabled()){status.textContent='Logowanie online nie zostało jeszcze uruchomione. Gra nadal działa lokalnie.';document.querySelectorAll('button').forEach(b=>b.disabled=true);}else run(async()=>{await Online.callback();await back();});
for(const p of ['google','facebook'])document.getElementById(p).onclick=()=>run(()=>Online.oauth(p));
document.getElementById('mail').onsubmit=e=>{e.preventDefault();run(async()=>{email=document.getElementById('email').value;await Online.email(email);document.getElementById('otp').hidden=false;status.textContent='Sprawdź e-mail i wpisz otrzymany kod.';});};
document.getElementById('otp').onsubmit=e=>{e.preventDefault();run(async()=>{await Online.verify(email,document.getElementById('code').value);await back();});};
document.getElementById('logout').onclick=()=>run(async()=>{await Online.logout();location.reload();});
</script></html>
