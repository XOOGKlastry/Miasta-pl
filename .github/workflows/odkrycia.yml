name: Odkrycia (ludzie, zabytki, wydarzenia, drogi)

on:
  workflow_dispatch:
  push:
    paths:
      - "narzedzia/pobierz_odkrycia.py"
      - ".github/workflows/odkrycia.yml"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  odkrycia:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pobieranie
        run: python narzedzia/pobierz_odkrycia.py 2>&1 | tee narzedzia/odkrycia.log
      - name: Zapisz zmiany
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add narzedzia/odkrycia.log
          [ -f narzedzia/odkrycia-surowe.json ] && git add narzedzia/odkrycia-surowe.json || true
          if ! git diff --cached --quiet; then git commit -m "Odkrycia: surowe dane"; for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && break; sleep $((i*7)); done; fi
