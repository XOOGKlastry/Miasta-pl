name: Dane gier (herby, rzeki)

on:
  workflow_dispatch:
  push:
    paths:
      - "narzedzia/**"
      - ".github/workflows/herby.yml"
  schedule:
    - cron: "0 3 1 * *"   # raz w miesiącu

permissions:
  contents: write

jobs:
  dane:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Herby
        run: python narzedzia/pobierz_herby.py
      - name: Rzeki
        continue-on-error: true
        run: python narzedzia/pobierz_rzeki.py 2>&1 | tee narzedzia/rzeki.log
      - name: Zapisz zmiany
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add herby.json herby rzeki.json narzedzia/rzeki.log
          git diff --cached --quiet || (git commit -m "Dane gier: aktualizacja" && git pull --rebase && git push)
