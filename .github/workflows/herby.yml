name: Dane gier (herby, rzeki)

on:
  workflow_dispatch:
  push:
    paths:
      - "narzedzia/pobierz_herby.py"
      - "narzedzia/pobierz_rzeki.py"
      - ".github/workflows/herby.yml"
  schedule:
    - cron: "0 3 1 * *"   # raz w miesiącu

permissions:
  contents: write

# jeden zapis do repo naraz, żeby automaty sobie nie przeszkadzały
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  dane:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Herby
        run: python narzedzia/pobierz_herby.py
      - name: Rzeki
        continue-on-error: true
        run: python narzedzia/pobierz_rzeki.py 2>&1 | tee narzedzia/rzeki.log
      - name: Zapisz zmiany
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add herby.json herby rzeki.json rzeki-geo.json narzedzia/rzeki.log
          if ! git diff --cached --quiet; then git commit -m "Dane gier: aktualizacja"; for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && break; sleep $((i*7)); done; fi
