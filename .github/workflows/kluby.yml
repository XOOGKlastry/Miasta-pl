name: "Herby klubów piłkarskich"

on:
  workflow_dispatch:
  push:
    paths:
      - "narzedzia/pobierz_herby_klubow.py"
      - ".github/workflows/kluby.yml"
  schedule:
    - cron: "0 6 4 * *"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  miejsca:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Zdjęcia
        run: python narzedzia/pobierz_herby_klubow.py 2>&1 | tee narzedzia/kluby.log
      - name: Zapisz zmiany
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add narzedzia/kluby.log
          git add -A kluby.json kluby
          if ! git diff --cached --quiet; then git commit -m "Herby klubów: aktualizacja"; for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && break; sleep $((i*7)); done; fi
