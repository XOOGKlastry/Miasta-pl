name: Zdjęcia miast: wybór z panelu

on:
  workflow_dispatch:
  push:
    paths:
      - "narzedzia/zdjecia-wybor.json"

permissions:
  contents: write

concurrency:
  group: zapis-danych
  cancel-in-progress: false

jobs:
  miejsca:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Zdjęcia
        run: python narzedzia/pobierz_miejsca.py --tylko-gra 2>&1 | tee narzedzia/miejsca.log
      - name: Zapisz zmiany
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add narzedzia/miejsca.log
          [ -f miejsca.json ] && git add -A miejsca.json miejsca || true
          git diff --cached --quiet || (git commit -m "Zdjęcia miast: aktualizacja" && git pull --rebase && git push)
