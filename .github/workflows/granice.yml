name: Granice gmin (PRG)

on:
  workflow_dispatch:
  push:
    paths:
      - "narzedzia/gminy.sh"
      - ".github/workflows/granice.yml"

permissions:
  contents: write

# jeden zapis do repo naraz, żeby automaty sobie nie przeszkadzały
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  gminy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin unzip
      - name: Gminy
        run: bash narzedzia/gminy.sh 2>&1 | tee narzedzia/gminy.log
      - name: Zapisz zmiany
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add narzedzia/gminy.log
          [ -f gminy.topojson ] && git add gminy.topojson || true
          if ! git diff --cached --quiet; then git commit -m "Granice gmin: PRG"; for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && break; sleep $((i*7)); done; fi
