name: Mapki do kart gmin

on:
  workflow_dispatch:
  push:
    paths:
      - "narzedzia/pobierz_mapki.py"
      - ".github/workflows/mapki.yml"
  schedule:
    - cron: "0 5 6 * *"   # raz w miesiącu

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  mapki:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Mapki
        run: pip install shapely >/dev/null && python narzedzia/pobierz_mapki.py 2>&1 | tee narzedzia/mapki.log
      - name: Zapisz zmiany
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add narzedzia/mapki.log
          git add -A mapki || true
          if ! git diff --cached --quiet; then git commit -m "Mapki kart: aktualizacja"; for i in 1 2 3 4 5; do git pull --rebase -X theirs && git push && break; sleep $((i*7)); done; fi
