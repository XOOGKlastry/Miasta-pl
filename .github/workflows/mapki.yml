name: Mapki do kart gmin

on:
  workflow_dispatch:
  push:
    paths:
      - "narzedzia/pobierz_mapki.py"
      - "narzedzia/pobierz_mapki_topo.py"
      - ".github/workflows/mapki.yml"
  schedule:
    - cron: "0 5 6 * *"   # raz w miesiącu

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  mapki:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Mapki
        run: |
          set -o pipefail
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq osmium-tool >/dev/null
          osmium --version | head -1
          pip install shapely >/dev/null
          python narzedzia/pobierz_mapki.py 2>&1 | tee narzedzia/mapki.log
          du -sh mapki | tee -a narzedzia/mapki.log
      - name: Zapisz zmiany
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git config http.postBuffer 524288000
          {
            echo "--- rozmiar danych"; du -sh mapki; ls mapki | wc -l
            echo "--- największe pliki"; ls -S -l mapki | head -5
          } | tee -a narzedzia/mapki.log
          git add narzedzia/mapki.log
          git add -A mapki || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Mapki kart: aktualizacja"
          ok=0
          for i in 1 2 3 4; do
            if git pull -q --rebase -X theirs >/tmp/push.log 2>&1 && git push >>/tmp/push.log 2>&1; then ok=1; break; fi
            sleep $((i*15))
          done
          if [ "$ok" != 1 ]; then
            # nie udało się wypchnąć mapek: zapisz przynajmniej log z przyczyną, żeby było widać, co poszło nie tak
            cat /tmp/push.log | tail -30
            git reset -q --hard origin/main 2>/dev/null || git reset -q --hard HEAD~1
            git pull -q --rebase || true
            { echo "--- BŁĄD WYPCHNIĘCIA"; tail -30 /tmp/push.log; } >> narzedzia/mapki-blad.log
            git add narzedzia/mapki-blad.log && git commit -q -m "Mapki kart: błąd wypchnięcia" && git push
            exit 1
          fi
