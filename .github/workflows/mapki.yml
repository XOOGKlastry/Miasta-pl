name: Mapki do kart gmin

on:
  workflow_dispatch:
  push:
    paths:
      - "narzedzia/pobierz_mapki.py"
      - "narzedzia/pobierz_mapki_topo.py"
      - ".github/workflows/mapki.yml"
  schedule:
    - cron: "0 5 6 * *"   # raz w miesiącu

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  mapki:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Mapki
        run: |
          set -o pipefail
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq osmium-tool >/dev/null
          osmium --version | head -1
          pip install shapely >/dev/null
          python narzedzia/pobierz_mapki.py 2>&1 | tee narzedzia/mapki.log
          du -sh mapki | tee -a narzedzia/mapki.log
      - name: Zapisz zmiany
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add narzedzia/mapki.log
          git add -A mapki || true
          git config http.postBuffer 524288000
          du -sh mapki
          git status --short | head -5
          if ! git diff --cached --quiet; then
            git commit -q -m "Mapki kart: aktualizacja"
            ok=0; for i in 1 2 3 4 5 6; do git pull --rebase -X theirs && git push && ok=1 && break; sleep $((i*10)); done
            [ "$ok" = 1 ] || { echo "nie udało się wypchnąć zmian"; exit 1; }
          fi
