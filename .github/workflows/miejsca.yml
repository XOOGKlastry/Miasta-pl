name: Zdjęcia miast (Co to za miasto?)

on:
  workflow_dispatch:
  push:
    paths:
      - "narzedzia/pobierz_miejsca.py"
      - "narzedzia/zdjecia-wybor.json"
      - ".github/workflows/miejsca.yml"
  schedule:
    - cron: "0 4 2 * *"   # raz w miesiącu

permissions:
  contents: write

concurrency:
  group: zapis-danych
  cancel-in-progress: false

jobs:
  miejsca:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Zdjęcia
        run: python narzedzia/pobierz_miejsca.py 2>&1 | tee narzedzia/miejsca.log
      - name: Zapisz zmiany
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add narzedzia/miejsca.log
          [ -f miejsca.json ] && git add -A miejsca.json miejsca || true
          [ -f kandydaci.json ] && git add kandydaci.json || true
          git diff --cached --quiet || (git commit -m "Zdjęcia miast: aktualizacja" && git pull --rebase && git push)
