<head>

<title>Miasta na czas · Znasz Polskę?</title>
<meta name="theme-color" content="#0C1A1D" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />

<style>
.setup .tryby{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tryb{min-height:118px;border-radius:18px;border:1px solid var(--line-2);background:var(--ink-2);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;transition:transform var(--szybko),border-color var(--szybko),background var(--szybko)}
.tryb .ik{font-size:38px;line-height:1.1}
.tryb b{font-family:"Fraunces",serif;font-size:21px}
.tryb small{font-size:12px;color:var(--dim)}
.tryb:hover{border-color:var(--gold)}
.tryb:active{transform:scale(.97)}
#startMow{background:linear-gradient(180deg,var(--gold-2),var(--gold));border:none;color:var(--gold-ink)}
#startMow small{color:#6B5317}
.setup .datastate b{color:var(--gold)}

.stage{flex:1;min-height:120px;position:relative}
#map{position:absolute;inset:0;background:var(--land)}
#msg{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:600;max-width:88%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:rgba(10,24,27,.9);border:1px solid var(--line-2);border-radius:999px;padding:6px 14px;font-size:14px;color:var(--paper);
  transition:opacity var(--wolno)}
#msg:empty{opacity:0}
#msg.good{border-color:var(--ok);color:var(--ok)}
#msg.dup{border-color:var(--gold);color:var(--gold)}

.gra{flex:none;display:flex;gap:8px;align-items:stretch}
.pisz,.mow{flex:1;min-width:0;display:flex;gap:8px;align-items:center}
#guess{flex:1;min-width:0;font-size:19px;min-height:52px}
.kw{width:52px;height:52px;flex:none;border-radius:var(--r-s);border:1px solid var(--line-2);background:var(--ink-2);font-size:22px}
#mic{width:64px;height:64px;flex:none;border-radius:50%;border:none;font-size:28px;
  background:linear-gradient(180deg,var(--gold-2),var(--gold));box-shadow:0 6px 20px rgba(242,193,78,.25);
  transition:transform var(--szybko),background var(--szybko);touch-action:none;user-select:none;-webkit-user-select:none}
#mic.on{background:var(--red);animation:mikro 1.2s ease-in-out infinite}
@keyframes mikro{0%,100%{box-shadow:0 0 0 0 rgba(224,70,90,.55)}50%{box-shadow:0 0 0 12px rgba(224,70,90,0)}}
.mowtxt{flex:1;min-width:0;display:flex;flex-direction:column}
.mowtxt b{font-size:15px}
#heard{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stopBtn{min-height:52px;padding:0 14px;flex:none}

.side{display:flex;flex-direction:column;gap:12px}
.uchwyt{width:44px;height:5px;border-radius:3px;background:var(--line-2);margin:0 auto 2px}
.wynik{display:flex;align-items:center;gap:16px}
.kolo{position:relative;width:96px;height:96px;flex:none}
.kolo svg{width:100%;height:100%;transform:rotate(-90deg)}
.kolo circle{fill:none;stroke-width:9}
.kolo .tlo{stroke:var(--line)}
.kolo .pas{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset 1.2s cubic-bezier(.2,.7,.3,1)}
.kolo b{position:absolute;inset:0;display:grid;place-items:center;font-family:"Fraunces",serif;font-size:24px}
.liczby .score{font-family:"Fraunces",serif;font-weight:900;font-size:44px;line-height:1}
.liczby .score span{font-size:20px;color:var(--dim);font-weight:600}
.liczby .sub{color:var(--dim);margin:4px 0 0;font-size:14px}
.link{background:none;border:none;color:var(--gold);font-size:14px;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
.side h2{font-size:12px;font-weight:600;color:var(--dim);margin:6px 0 0;letter-spacing:.08em;text-transform:uppercase}
.woje{display:flex;flex-direction:column;gap:2px}
.wojrow{display:flex;align-items:center;gap:10px;font-size:14px;padding:3px 0}
.wojrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wojrow .mini{width:90px;height:6px;background:var(--line);border-radius:3px;overflow:hidden;flex:none}
.wojrow .mini i{display:block;height:100%;background:var(--gold);width:0;border-radius:3px}
.wojrow .ct{width:58px;text-align:right;color:var(--dim);font-variant-numeric:tabular-nums;flex:none;font-size:13px}
.chipy{display:flex;flex-wrap:wrap;gap:6px}
.chipy span{background:var(--ink-2);border:1px solid var(--line-2);border-radius:999px;padding:5px 11px;font-size:14px}
.empty{color:var(--dim);font-size:14px}
.side{position:fixed;left:0;right:0;bottom:0;z-index:1200;max-height:86%;overflow:auto;max-width:560px;margin:0 auto;
  background:var(--ink);border-top:1px solid var(--line-2);border-radius:22px 22px 0 0;
  padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 16px);
  transform:translateY(105%);transition:transform var(--wolno);box-shadow:0 -20px 40px rgba(0,0,0,.45)}
.side.open{transform:none}
#shade{display:none}
#shade.on{display:block;position:fixed;inset:0;z-index:1100;background:rgba(5,12,14,.6);animation:wejscie var(--szybko) both}

.leaflet-container{background:var(--land);font-family:inherit}
.leaflet-control-layers,.leaflet-bar a{background:var(--ink-2);color:var(--paper);border-color:var(--line-2)}
.leaflet-bar a{color:var(--paper);width:34px;height:34px;line-height:34px;font-size:20px}
.leaflet-bar a:hover{background:var(--ink-3);color:var(--paper)}
.leaflet-control-layers-expanded{color:var(--paper);font-size:13px}
.lbl{background:none;border:none;box-shadow:none;color:#fff;font-weight:600;font-size:12px;text-shadow:0 0 4px #000,0 0 2px #000;padding:0}
.lbl::before{display:none}
</style>
</head>
<body>
<div class="app">

<header>
  <a class="back" href="./" aria-label="Wróć do listy gier">‹</a>
  <h1>Miasta na czas</h1>
  <span class="round" id="licznik"></span>
</header>

<!-- ekran startowy: tylko czas i województwo -->
<section class="setup" id="setup">
  <h2>Wymień jak najwięcej miast</h2>
  <p>Każde trafione miasto zapala się na mapie. Nazwy bez polskich znaków też działają.</p>
  <label class="field"><span>Czas</span>
    <select id="dur">
      <option value="60">1 minuta</option>
      <option value="180" selected>3 minuty</option>
      <option value="300">5 minut</option>
      <option value="600">10 minut</option>
      <option value="0">bez limitu</option>
    </select>
  </label>
  <label class="field"><span>Województwo</span>
    <select id="woj"><option value="">cała Polska</option></select>
  </label>
  <div class="tryby">
    <button class="tryb" id="startMow"><span class="ik">🎤</span><b>Mówię</b><small>nazwy na głos</small></button>
    <button class="tryb" id="startPisz"><span class="ik">⌨️</span><b>Piszę</b><small>na klawiaturze</small></button>
  </div>
  <div class="datastate"><span id="total">–</span> miast do znalezienia · rekord <b id="best">0</b> · <span id="datastate">wczytywanie…</span></div>
</section>

<!-- rozgrywka: pasek czasu, mapa, pole odpowiedzi -->
<div class="tbar hidden" id="tbar"><i id="tfill"></i></div>
<div class="stage hidden" id="stage">
  <div id="map"></div>
  <span class="pill" id="msg"></span>
</div>
<div class="gra hidden" id="gra">
  <div class="pisz" id="piszBox">
    <input id="guess" type="text" placeholder="Wpisz nazwę miasta" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" />
    <button class="kw" id="naMow" aria-label="Przełącz na mówienie">🎤</button>
  </div>
  <div class="mow hidden" id="mowBox">
    <button id="mic" aria-label="Mów">🎤</button>
    <div class="mowtxt"><b id="micState">Stuknij i mów</b><span id="heard"></span></div>
    <button class="kw" id="naPisz" aria-label="Przełącz na pisanie">⌨️</button>
  </div>
  <button class="ghost" id="stopBtn">Zakończ</button>
</div>

<aside class="side" id="side">
  <div class="uchwyt"></div>
  <div class="wynik" id="resultPanel">
    <div class="kolo" id="kolo"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" class="tlo"/><circle cx="50" cy="50" r="44" class="pas" id="koloPas"/></svg><b id="koloProc">0%</b></div>
    <div class="liczby"><div class="score" id="rBig">0</div><p class="sub" id="rSub"></p></div>
  </div>
  <div class="btnrow">
    <button class="ghost" id="menuBtn">Ustawienia</button>
    <button class="big" id="againBtn">Jeszcze raz</button>
  </div>
  <button class="link" id="revealBtn">Pokaż pominięte miasta na mapie</button>
  <h2 id="wojHead">Województwa</h2>
  <div class="woje" id="wojList"></div>
  <h2 id="listHead">Trafione miasta</h2>
  <div class="chipy" id="found"></div>
</aside>
<div id="shade"></div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

/* ---------- województwa ---------- */
let WOJ=[]; // {name, rings:[[ [lon,lat], ... ]] }
function bbox(ring){let a=180,b=90,c=-180,d=-90;for(const p of ring){if(p[0]<a)a=p[0];if(p[1]<b)b=p[1];if(p[0]>c)c=p[0];if(p[1]>d)d=p[1];}return [a,b,c,d];}
function inRing(x,y,r){let ins=false;for(let i=0,j=r.length-1;i<r.length;j=i++){const xi=r[i][0],yi=r[i][1],xj=r[j][0],yj=r[j][1];if((yi>y)!==(yj>y)&&x<(xj-xi)*(y-yi)/(yj-yi)+xi)ins=!ins;}return ins;}
function wojOf(lon,lat){
  for(const w of WOJ){
    for(let i=0;i<w.rings.length;i++){
      const b=w.bb[i];
      if(lon<b[0]||lon>b[2]||lat<b[1]||lat>b[3])continue;
      if(inRing(lon,lat,w.rings[i]))return w.name;
    }
  }
  return null;
}
async function loadWoj(){
  try{
    const r=await fetch("woj.geojson?v=15");
    const gj=await r.json();
    wojLayer=L.geoJSON(gj,{style:{color:"#F2C14E",weight:1.4,opacity:.85,fill:false,dashArray:"4 3"},interactive:false}).addTo(map);
    WOJ=gj.features.map(f=>{
      const g=f.geometry;
      const rings=g.type==="Polygon"?[g.coordinates[0]]:g.coordinates.map(p=>p[0]);
      return {name:f.properties.nazwa,rings,bb:rings.map(bbox)};
    }).sort((a,b)=>a.name.localeCompare(b.name,"pl"));
    const sel=$("woj");
    WOJ.forEach(w=>{const o=document.createElement("option");o.value=w.name;o.textContent=w.name;sel.appendChild(o);});
    refreshScope();
  }catch(e){
    $("wojList").innerHTML='<div class="empty">Nie udało się wczytać granic województw (plik woj.geojson).</div>';
  }
}

/* ---------- dane miast ---------- */
let ALL=[],targets=[],byKey=new Map(),found=[];
const CACHE_KEY="pl-miasta-osm-v2";
async function loadCities(){
  const cached=localStorage.getItem(CACHE_KEY);
  if(cached){
    try{const o=JSON.parse(cached);
      if(o.cities&&o.cities.length>400){
        ALL=o.cities;
        $("datastate").textContent=ALL.length+" miast (OSM, pobrane "+new Date(o.ts).toLocaleDateString("pl-PL")+")";
        return refreshScope();
      }}catch(e){}
  }
  const q='[out:json][timeout:90];area["ISO3166-1"="PL"][admin_level=2]->.pl;(node["place"~"^(city|town)$"](area.pl););out body;';
  for(const h of ["https://overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter"]){
    try{
      $("datastate").textContent="Pobieram listę miast z OpenStreetMap…";
      const res=await fetch(h,{method:"POST",body:"data="+encodeURIComponent(q)});
      if(!res.ok)throw 0;
      const j=await res.json();
      const seen=new Set();
      ALL=j.elements.filter(e=>e.tags&&e.tags.name).map(e=>({
        name:e.tags.name.trim(),lat:e.lat,lon:e.lon,
        pop:parseInt((e.tags.population||"0").replace(/\D/g,""),10)||0
      })).filter(c=>{const k=norm(c.name)+"|"+c.lat.toFixed(2);if(seen.has(k))return false;seen.add(k);return true;});
      if(ALL.length<400)throw 0;
      ALL.forEach(c=>{c.woj=wojOf(c.lon,c.lat);});
      localStorage.setItem(CACHE_KEY,JSON.stringify({ts:Date.now(),cities:ALL}));
      $("datastate").textContent=ALL.length+" miast (OSM, pobrane dziś)";
      return refreshScope();
    }catch(e){}
  }
  ALL=FALLBACK.map(f=>({name:f[0],lat:f[1],lon:f[2],pop:f[3]}));
  ALL.forEach(c=>{c.woj=wojOf(c.lon,c.lat);});
  $("datastate").textContent="Brak połączenia: wbudowana lista "+ALL.length+" miast";
  refreshScope();
}

function refreshScope(){
  if(!ALL.length)return;
  if(WOJ.length&&ALL.some(c=>c.woj===undefined))ALL.forEach(c=>{if(c.woj===undefined)c.woj=wojOf(c.lon,c.lat);});
  const w=$("woj").value;
  const pool=ALL.filter(c=>ZP.wObszarze(c));
  byKey=new Map();
  pool.forEach(c=>{
    const k=norm(c.name);if(!k)return;
    if(!byKey.has(k))byKey.set(k,{name:c.name,pop:c.pop,woj:c.woj,pts:[]});
    const t=byKey.get(k);
    t.pts.push([c.lat,c.lon]);
    if(c.pop>t.pop){t.pop=c.pop;t.name=c.name;t.woj=c.woj;}
  });
  targets=[...byKey.values()];targets.forEach(t=>t.hit=false);
  LAP=ZP.lapacz([...byKey.keys()],k=>byKey.get(k).hit);
  $("total").textContent=targets.length;licznik();
  $("best").textContent=localStorage.getItem(bestKey())||0;
  found=[];pinLayer.clearLayers();renderFound();renderWoj();
  if(w&&wojLayer){
    const f=wojLayer.getLayers().find(l=>l.feature.properties.nazwa===w);
    if(f)map.fitBounds(f.getBounds());
  }else map.fitBounds(PL_BOUNDS);
}
const bestKey=()=>"pl-best-dsm-"+(ZP.OBSZAR.length?ZP.OBSZAR.slice().sort().join(","):"pl");
$("woj").addEventListener("change",()=>{if(!running)refreshScope();});

/* ---------- rysowanie ---------- */
function drawTarget(t,color,label){
  const big=(t.pop||0)>=100000;
  t.pts.forEach(([lat,lon])=>{
    const m=L.circleMarker([lat,lon],{
      radius:big?7:5,color:"#0C1A1D",weight:1.5,fillColor:color,fillOpacity:color==="#E2603F"?.7:.95
    }).addTo(pinLayer);
    if(label&&big)m.bindTooltip(t.name,{permanent:true,direction:"right",className:"lbl",offset:[6,0]});
    else m.bindTooltip(t.name,{direction:"top",className:"lbl"});
  });
}

/* ---------- rozgrywka ---------- */
let running=false,paused=false,endless=false,left=0,tick=null,deadline=0,startedAt=0,pausedAt=0;
const fmt=s=>Math.floor(s/60)+":"+String(Math.max(0,s%60)).padStart(2,"0");
function setMsg(t,cls){const m=$("msg");m.textContent=t;m.className=cls||"";}
let tryb="pisz";
function ustawTryb(t){
  tryb=(t==="mow"&&SR)?"mow":"pisz";
  $("piszBox").classList.toggle("hidden",tryb!=="pisz");
  $("mowBox").classList.toggle("hidden",tryb!=="mow");
  if(!running)return;
  if(tryb==="pisz"){stopMic();ZP.fokus($("guess"));}
  else{$("guess").blur();startMic();}
}
function start(t){
  if(!targets.length)return;
  targets.forEach(x=>x.hit=false);
  found=[];pinLayer.clearLayers();running=true;paused=false;
  openSide(false);renderFound();renderWoj();
  $("setup").classList.add("hidden");
  ["stage","gra"].forEach(id=>$(id).classList.remove("hidden"));
  map.invalidateSize({pan:false});
  const wyb=wojLayer?wojLayer.getLayers().filter(l=>ZP.OBSZAR.indexOf(l.feature.properties.nazwa)>=0):[];
  if(wyb.length){let bb=wyb[0].getBounds();wyb.forEach(l=>bb.extend(l.getBounds()));map.fitBounds(bb);}
  else map.fitBounds(PL_BOUNDS);
  const d=+$("dur").value;endless=(d===0);
  left=d;deadline=Date.now()+d*1000;startedAt=Date.now();
  $("tbar").classList.toggle("hidden",endless);$("tbar").classList.remove("malo","stop");$("tfill").style.width="100%";
  licznik();
  $("guess").value="";
  setMsg("","");
  ustawTryb(t);
  tick=setInterval(step,200);
}
function licznik(){$("licznik").textContent=running||found.length?found.length+" / "+targets.length:"";}
function step(){
  if(paused)return;
  if(endless)return;
  const ms=Math.max(0,deadline-Date.now());left=Math.round(ms/1000);
  const d=+$("dur").value;
  $("tfill").style.width=(100*ms/(d*1000)).toFixed(2)+"%";
  $("tbar").classList.toggle("malo",ms<=15000);
  if(ms<=0)stop();
}
function stop(){
  if(!running)return;
  clearInterval(tick);running=false;stopMic();
  $("tbar").classList.add("stop");
  $("gra").classList.add("hidden");
  const pct=targets.length?Math.round(found.length/targets.length*100):0;
  const k=bestKey(),best=+(localStorage.getItem(k)||0);
  const rec=found.length>best;
  if(rec){localStorage.setItem(k,found.length);$("best").textContent=found.length;}
  $("rBig").innerHTML=found.length+' <span>z '+targets.length+'</span>';
  $("koloProc").textContent=pct+"%";
  const obw=2*Math.PI*44;$("koloPas").style.strokeDasharray=obw;$("koloPas").style.strokeDashoffset=obw;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{$("koloPas").style.strokeDashoffset=obw*(1-pct/100);}));
  if(rec&&found.length>=5||pct>=60)setTimeout(ZP.fanfary,500);
  $("rSub").textContent=(ZP.OBSZAR.length===1?"woj. "+ZP.OBSZAR[0]:ZP.OBSZAR.length?ZP.OBSZAR.length+" województw":"cała Polska")+". "+(rec?"Nowy rekord!":"Rekord: "+Math.max(best,found.length)+".");
  setMsg("","");
  $("guess").blur();openSide(true);
}
function hit(k,source){
  const t=byKey.get(k);
  if(!t)return false;
  if(t.hit){setMsg(t.name+" już było","dup");return true;}
  t.hit=true;found.push(t);
  drawTarget(t,"#F2C14E",true);
  licznik();
  setMsg(t.name+(t.pop?", "+t.pop.toLocaleString("pl-PL")+" mieszk.":""),"good");
  renderFound();renderWoj();
  return true;
}
/* pisanie: „Opole” nie może przechwycić „Opole Lubelskie” */
let LAP=()=>({stan:"nic"}),czekaj=null;
function przyjmij(k){clearTimeout(czekaj);hit(k,"tekst");$("guess").value="";}
function lap(pauza){
  const r=LAP($("guess").value);
  if(r.stan==="nic")return;
  const t=byKey.get(r.klucz);
  // już trafione (np. „Opole”, gdy ktoś pisze „Opole Lubelskie”): nie przerywaj pisania,
  // komunikat dopiero po chwili bez pisania
  if(t&&t.hit){
    if(pauza===true){setMsg(t.name+" już było","dup");$("guess").value="";}
    else czekaj=setTimeout(()=>lap(true),1600);
    return;
  }
  if(r.stan==="od razu"||pauza===true){przyjmij(r.klucz);return;}
  // jest dłuższa nazwa o tym samym początku: poczekaj, czy ktoś pisze dalej
  czekaj=setTimeout(()=>lap(true),1200);
}
$("guess").addEventListener("input",()=>{
  if(!running||paused)return;
  clearTimeout(czekaj);lap();
});
$("guess").addEventListener("keydown",e=>{
  if(e.key!=="Enter"||!running)return;
  e.preventDefault();clearTimeout(czekaj);
  const r=LAP($("guess").value);if(r.stan!=="nic")przyjmij(r.klucz);
});

/* ---------- mowa ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,micOn=false,holdTimer=null;
if(!SR){$("mic").title="Ta przeglądarka nie obsługuje rozpoznawania mowy";$("startMow").querySelector("small").textContent="niedostępne w tej przeglądarce";$("startMow").disabled=true;$("naMow").style.display="none";}
function matchPhrase(txt){
  const words=txt.trim().split(/\s+/).filter(Boolean);
  let any=false;
  for(let n=4;n>=1;n--){
    for(let i=0;i+n<=words.length;i++){
      const k=norm(words.slice(i,i+n).join(""));
      if(k.length>=3&&byKey.has(k)&&!byKey.get(k).hit){if(hit(k,"głos"))any=true;}
    }
  }
  return any;
}
function startMic(){
  if(!SR||micOn||!running||paused)return;
  rec=new SR();
  rec.lang="pl-PL";rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=3;
  rec.onresult=e=>{
    let interim="";
    for(let i=e.resultIndex;i<e.results.length;i++){
      const r=e.results[i];
      for(let a=0;a<r.length;a++)matchPhrase(r[a].transcript);
      if(!r.isFinal)interim+=r[0].transcript+" ";
    }
    $("heard").textContent=interim?"słyszę: "+interim.trim():"";
  };
  rec.onerror=e=>{
    if(e.error==="not-allowed")setMsg("Brak zgody na mikrofon. Włącz go w ustawieniach strony.","");
    stopMic();
  };
  rec.onend=()=>{if(micOn&&running&&!paused){try{rec.start();}catch(e){}}else stopMic();};
  try{rec.start();micOn=true;$("mic").classList.add("on");$("micState").textContent="Słucham…";$("heard").textContent="mów nazwy miast";}
  catch(e){micOn=false;}
}
function stopMic(){
  micOn=false;$("mic").classList.remove("on");$("heard").textContent="";$("micState").textContent="Stuknij i mów";
  if(rec){try{rec.onend=null;rec.stop();}catch(e){}rec=null;}
}
$("mic").addEventListener("click",()=>{micOn?stopMic():startMic();});
$("mic").addEventListener("pointerdown",e=>{
  holdTimer=setTimeout(()=>{holdTimer=null;if(!micOn)startMic();},250);
});
["pointerup","pointercancel","pointerleave"].forEach(ev=>$("mic").addEventListener(ev,()=>{
  if(holdTimer){clearTimeout(holdTimer);holdTimer=null;}
}));

/* ---------- listy ---------- */
function renderFound(){
  const box=$("found");
  $("listHead").textContent="Trafione miasta: "+found.length;
  if(!found.length){box.innerHTML='<div class="empty">Tym razem żadne.</div>';return;}
  box.innerHTML="";
  found.slice().sort((a,b)=>(b.pop||0)-(a.pop||0)).forEach(t=>{const s=document.createElement("span");s.textContent=t.name;box.appendChild(s);});
}
function renderWoj(){
  const box=$("wojList");
  if(!WOJ.length||!targets.length){box.innerHTML='<div class="empty">Brak danych o granicach.</div>';return;}
  const tot={},hits={};
  targets.forEach(t=>{const w=t.woj||"poza granicami";tot[w]=(tot[w]||0)+1;if(t.hit)hits[w]=(hits[w]||0)+1;});
  const klucze=Object.keys(tot).filter(w=>w!=="poza granicami").sort((a,b)=>(hits[b]||0)/tot[b]-(hits[a]||0)/tot[a]);
  $("wojHead").style.display=klucze.length>1?"":"none";box.style.display=klucze.length>1?"":"none";
  box.innerHTML=klucze.map(w=>{
    const h=hits[w]||0,pc=Math.round(h/tot[w]*100);
    return '<div class="wojrow"><span class="nm">'+w+'</span><span class="mini"><i style="width:'+pc+'%"></i></span><span class="ct">'+h+" z "+tot[w]+'</span></div>';
  }).join("");
}

$("startMow").onclick=()=>start("mow");
$("startPisz").onclick=()=>start("pisz");
$("againBtn").onclick=()=>start(tryb);
$("stopBtn").onclick=stop;
$("naMow").onclick=()=>ustawTryb("mow");
$("naPisz").onclick=()=>ustawTryb("pisz");
$("menuBtn").onclick=()=>{
  openSide(false);
  ["stage","gra","tbar"].forEach(id=>$(id).classList.add("hidden"));
  $("setup").classList.remove("hidden");$("licznik").textContent="";
};
$("revealBtn").onclick=()=>{
  openSide(false);
  targets.filter(t=>!t.hit).forEach(t=>drawTarget(t,"#E2603F",false));
  setMsg("Żółte to trafione, czerwone to pominięte.","");
};

function openSide(on){$("side").classList.toggle("open",on);$("shade").classList.toggle("on",on);}
$("shade").onclick=()=>{if(!running)openSide(false);};
(function(){
