<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Album kart · PolskoZnawca</title>
<meta name="theme-color" content="#FFF6E0" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@500;700;900&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="plansza.css?v=4" />
<style>
/* album w stylu planszy: zielone sukno, kremowe pola, brązowe obrysy, żółte akcenty */
.tresc{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:12px 12px 28px;display:flex;flex-direction:column;gap:12px}
.postep{padding:12px 14px}
.postep .gora2{display:flex;justify-content:space-between;align-items:baseline}
.postep .gora2 span{font-weight:900;font-size:14px}
.postep .gora2 b{font-family:Bungee,sans-serif;font-weight:400;font-size:20px}
.postep .pasek{height:14px;border-radius:8px;background:#fff;border:3px solid var(--braz);overflow:hidden;margin:8px 0 12px}
.postep .pasek i{display:block;height:100%;background:var(--ziel)}
.zetony{display:flex;justify-content:space-between;margin-top:12px;font-weight:900;font-size:13px}.zetony b{font-family:Bungee,sans-serif;font-weight:400}
.pasek.zet{height:10px;margin:5px 0 8px}.pasek.zet i{background:var(--zolt)}
.zasady{display:block;font-weight:800;font-size:12.5px;color:var(--braz-2)}
.rzadkosci{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.rzadkosci button{min-width:0;border-radius:12px;border:3px solid var(--braz);box-shadow:0 3px 0 var(--braz);padding:5px 1px;font:900 9px Rubik,sans-serif;color:var(--braz);overflow:hidden;cursor:pointer}
.rzadkosci button b{display:block;font-family:Bungee,sans-serif;font-weight:400;font-size:13px}
.rzadkosci button.akt{transform:translateY(3px);box-shadow:0 0 0 var(--braz);outline:3px solid var(--zolt);outline-offset:1px}
.rz-diament{background:linear-gradient(160deg,#F2FBFF,#BFE6FF 50%,#E6D6FF)}.rz-zloto{background:linear-gradient(160deg,#FFF3C2,#F5B82E)}.rz-srebro{background:linear-gradient(160deg,#F7F9FB,#C3CCD5)}.rz-braz{background:linear-gradient(160deg,#F4DCC4,#D69A6B)}.rz-zwykla{background:var(--krem)}
details.sek{background:var(--krem);border:4px solid var(--braz);border-radius:18px;box-shadow:0 5px 0 var(--braz);overflow:hidden}
details.sek>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;user-select:none}
details.sek>summary::-webkit-details-marker{display:none}
details.sek[open]>summary{border-bottom:3px dashed rgba(58,42,20,.35)}
summary .ikona{width:42px;height:42px;flex:none;display:grid;place-items:center;border-radius:12px;background:#fff;border:3px solid var(--braz)}
summary .ikona svg{width:32px;height:32px}summary .ikona svg path{fill:var(--zolt);stroke:var(--braz);stroke-width:1.4;vector-effect:non-scaling-stroke;stroke-linejoin:round}
summary .tyt{flex:1;min-width:0}
summary .tyt b{display:block;font-family:Bungee,sans-serif;font-weight:400;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
summary .tyt small{display:block;font-size:11.5px;font-weight:700;color:var(--braz-2)}
summary .mini-pasek{display:block;height:7px;border-radius:4px;background:#fff;border:2px solid var(--braz);margin-top:4px;overflow:hidden}
summary .mini-pasek i{display:block;height:100%;background:var(--ziel)}
summary .licz{font-family:Bungee,sans-serif;font-size:13px;white-space:nowrap}
summary .strz{width:28px;height:28px;flex:none;display:grid;place-items:center;border-radius:8px;background:var(--zolt);border:2px solid var(--braz);font-weight:900;transition:transform .2s}
details[open]>summary .strz{transform:rotate(90deg)}
.siatka{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 12px;padding:12px;background:repeating-linear-gradient(45deg,rgba(58,42,20,.04) 0 6px,transparent 6px 12px)}
@media (min-width:560px){.siatka{grid-template-columns:repeat(3,minmax(0,1fr))}}
.slot-reszta{aspect-ratio:5/7;border-radius:14px;border:3px dashed var(--braz-2);display:grid;place-items:center;text-align:center;font-weight:800;color:var(--braz-2);padding:10px;font-size:12.5px;background:rgba(255,255,255,.5)}
.slot-reszta b{display:block;font-family:Bungee,sans-serif;font-weight:400;font-size:26px;color:var(--braz)}
/* porządek w albumie: wyszukiwarka, układ i sortowanie */
.ap{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.ap input{width:100%;min-height:44px;border:3px solid var(--braz);border-radius:12px;padding:0 12px;font:700 15px Rubik,sans-serif;color:var(--braz);background:#fff;box-sizing:border-box}
.ap-wiersz{display:flex;align-items:flex-start;gap:6px;min-width:0}
.ap-wiersz>span{flex:none;width:52px;padding-top:9px;font-size:11.5px;font-weight:900;color:var(--braz-2);text-transform:uppercase;letter-spacing:.4px}
.ap-chipy{display:flex;flex-wrap:wrap;gap:6px 5px;min-width:0;padding:2px 0 4px}
.ap-chipy::-webkit-scrollbar{display:none}
.ap-chipy button{flex:none;border:2px solid var(--braz);border-radius:999px;background:#fff;font:800 12.5px Rubik,sans-serif;color:var(--braz);padding:5px 10px;cursor:pointer;box-shadow:0 2px 0 var(--braz)}
.ap-chipy button.akt{background:var(--zolt);transform:translateY(2px);box-shadow:none}
.wiecej-kart{grid-column:1/-1;justify-self:center;min-height:44px;font-size:14px}
/* paczki do otwarcia */
.paczki{display:flex;align-items:center;gap:14px;padding:12px 14px}
.paczka{position:relative;width:74px;height:96px;flex:none;border-radius:12px;border:4px solid var(--braz);box-shadow:0 5px 0 var(--braz);background:linear-gradient(160deg,#7DB36B,#4E8A45);display:grid;place-items:center;overflow:hidden}
.paczka::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.12) 0 6px,transparent 6px 12px)}
.paczka::after{content:"";position:absolute;left:0;right:0;top:14px;height:6px;background:var(--zolt);border-top:2px solid var(--braz);border-bottom:2px solid var(--braz)}
.paczka svg{position:relative;width:44px;height:44px;margin-top:10px}
.paczka .ile{position:absolute;right:-2px;top:-2px;z-index:2;min-width:26px;height:26px;border-radius:999px;background:var(--czer);color:#fff;border:3px solid var(--braz);font:900 12px/20px Rubik,sans-serif;text-align:center}
.paczka.gotowa{animation:paczkaKiw 1.6s ease-in-out infinite}
@keyframes paczkaKiw{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg) translateY(-3px)}}
.paczka.pusta{filter:grayscale(.8) opacity(.6)}
.paczki .opis{flex:1;min-width:0}
.paczki .opis b{display:block;font-family:Bungee,sans-serif;font-weight:400;font-size:16px}
.paczki .opis small{display:block;font-weight:700;color:var(--braz-2);font-size:12px;margin:2px 0 8px}
.paczki .klocek{min-height:44px;font-size:14px;padding:0 14px}
.otwieranie{position:fixed;inset:0;z-index:5500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(ellipse at 50% 45%,#7DB36B,#2F5A2C 75%);animation:wej .25s both}
.otwieranie .paczka{width:150px;height:196px;border-width:5px;cursor:pointer}
.otwieranie .paczka svg{width:90px;height:90px}
.otwieranie .paczka::after{top:30px;height:10px}
.otwieranie .paczka.trzes{animation:trzes .12s linear infinite}
@keyframes trzes{25%{transform:translate(-4px,2px) rotate(-3deg)}75%{transform:translate(4px,-2px) rotate(3deg)}}
.otwieranie .paczka.peka{animation:peka .5s ease-in both}
@keyframes peka{60%{transform:scale(1.25);filter:brightness(2)}100%{transform:scale(1.6);opacity:0;filter:brightness(4)}}
.otwieranie p{margin:0;font-family:Bungee,sans-serif;font-size:20px;color:var(--krem);text-shadow:0 3px 0 var(--braz);text-align:center}
.otwieranie small{color:var(--krem);font-weight:800}
.kk-podglad .kk-linki{margin-top:4px}
.puste{grid-column:1/-1;padding:12px;text-align:center;color:var(--braz-2);font-weight:700}
.kk-podglad{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px 16px;background:rgba(40,28,10,.78);animation:wej .2s both;overflow-y:auto;overflow-x:hidden}
@keyframes wej{from{opacity:0}}
.kk-podglad .kk{flex:none;width:min(84vw,340px,calc((100vh - 120px) / 1.6));animation:obrot .5s cubic-bezier(.3,1.3,.5,1) both}
.kk-podglad .kk-panel,.kk-podglad .kk-linki{flex:none}
@keyframes obrot{from{transform:rotateY(160deg) scale(.6)}}
.kk-podglad p{margin:0;max-width:380px;text-align:center;color:var(--krem);font-size:13px;font-weight:700;text-shadow:0 1px 0 var(--braz)}
.pak-braz{background:linear-gradient(135deg,#f3c79c,#a8642f)!important}.pak-legenda{background:linear-gradient(135deg,#fff6c9,#f0b52c 45%,#b9761a)!important;box-shadow:0 0 30px #ffd76a,0 12px 50px #223d3940!important}.pak-srebro{background:linear-gradient(135deg,#eef6f9,#8fa5b4)!important}.pak-zloto{background:linear-gradient(135deg,#fff2a3,#dda130)!important}.pak-diament{background:linear-gradient(135deg,#e4ffff,#9db3f4,#d9a5ef)!important}
.otwieranie .paczka{box-shadow:0 12px 50px #223d3940;border:2px solid #48665b}.otwieranie .paczka::before{background:linear-gradient(115deg,transparent 30%,#fff9 50%,transparent 70%);animation:pakBlask 1.5s ease infinite}
@keyframes pakBlask{from{transform:translateX(-150%)}to{transform:translateX(150%)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.szanse-panel{padding:14px 16px;border:1px solid #bfd0b1!important;box-shadow:0 3px 12px #28462910!important;border-radius:20px!important}.szanse-panel summary{font-size:15px;font-weight:700;cursor:pointer}.szanse-note{font-size:12px;line-height:1.5;color:#617257;margin:14px 0}.szanse-table{width:100%;border-collapse:collapse;font:13px/1.4 Rubik,system-ui,sans-serif}.szanse-table caption{text-align:left;font-size:12px;font-weight:700;color:#557049;padding:12px 0 6px}.szanse-table th{font-size:11px;color:#75826b;font-weight:500}.szanse-table th,.szanse-table td{text-align:left;padding:8px 0;border-bottom:1px solid #dce5d0}.szanse-table td:last-child,.szanse-table th:last-child{text-align:right;font-variant-numeric:tabular-nums}.drop-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin-top:16px}.drop-tabs button{border:1px solid #c4d4b8;border-radius:10px;font:500 11px/1.2 Rubik,system-ui,sans-serif;color:#315238;background:#f7faef;min-height:38px;padding:5px 2px}.drop-tabs button[aria-pressed=true]{background:#d9e9ca;border-color:#759d65}.rarity-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;background:#819768}.dot-braz{background:#bb8559}.dot-legenda{background:#f0b52c;box-shadow:0 0 0 2px #fff3c4}.dot-srebro{background:#92a7b5}.dot-zloto{background:#e1b33e}.dot-diament{background:#a48bd8}.rzadkosci{display:grid!important;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px!important}.rzadkosci>*{min-width:0!important;font-size:10px!important;padding:7px 2px!important;border-width:1px!important;box-shadow:none!important;border-radius:12px!important}.rzadkosci b{font-size:13px!important}.rzadkosci span{font-size:10px!important}.paczki{border-width:1px!important;box-shadow:0 3px 12px #28462910!important}
/* podgląd karty: dwie strony, bez przewijania */
.kk-podglad{overflow:hidden!important;justify-content:center!important;gap:8px!important}
.kk-podglad .close-preview{flex:none}
.kk-flip{--w:min(78vw,320px,calc((var(--app-h,100vh) - 300px) / 1.6));width:var(--w);height:calc(var(--w) * 1.6);position:relative;flex:none;perspective:1200px}
.kk-strona{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .6s cubic-bezier(.3,1.2,.4,1)}
.kk-strona.tyl{transform:rotateY(180deg)}
.kk-strona.tyl .kk{height:100%}
.kk-flip.odwrocona .przod{transform:rotateY(-180deg)}
.kk-flip.odwrocona .tyl{transform:rotateY(0)}
.kk-flip .kk{width:100%!important;animation:none!important}
.kk-pod{width:min(92vw,380px);flex:none;min-height:0}
.tyl-widac .kk-pod{opacity:.25}
.kk-przyciski{display:flex;gap:6px;flex-wrap:nowrap;justify-content:center;flex:none;max-width:96vw}
.kk-przyciski .kk-linki{display:contents}
.kk-przyciski .kk-linki a{min-height:44px;padding:0 10px;font-size:13px;white-space:nowrap}
.kk-tyl p{color:#3A2A14!important;text-shadow:none!important;font-size:12px!important;font-style:normal!important}
.kk-pod .kk-rekordy{gap:4px}
.kk-przyciski .klocek{min-height:44px;font-size:14px;padding:0 14px}
.kk-podglad>p{flex:none;font-size:11px!important;margin:0}
.kk-podglad>p:empty{display:none}
@media (prefers-reduced-motion:reduce){.kk-strona{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="gora"><a href="./" class="klocek jasny" style="min-height:40px;padding:0 12px" aria-label="Wróć">‹</a><h1>Album kart<small id="stan">wczytywanie…</small></h1></header>
  <main class="tresc" id="main">
    <section class="pole postep"><div class="gora2"><span>Zebrane karty</span><b id="ile">0 / 2479</b></div><div class="pasek"><i id="pasek" style="width:0"></i></div><div class="rzadkosci" id="rzadkosci"></div><div class="zetony"><span>🪙 Monety do paczki</span><b id="zet">0 / 25</b></div><div class="pasek zet"><i id="zetPasek" style="width:0"></i></div><a class="zasady" href="profil.html#kartyInfo">Jak zdobywać karty i jak liczy się OVR ›</a></section>
    <div data-pb="Oto Twoja kolekcja! Zbieraj wszystkie gminy."></div>
    <section class="pole ap" aria-label="Porządek w albumie">
      <input id="szukajK" type="search" placeholder="Szukaj w kolekcji: gmina, powiat…" autocomplete="off" enterkeyhint="search">
      <div class="ap-wiersz"><span>Układ</span><div class="ap-chipy" id="uklad" role="group" aria-label="Układ albumu"></div></div>
      <div class="ap-wiersz"><span>Sortuj</span><div class="ap-chipy" id="sortuj" role="group" aria-label="Sortowanie kart"></div></div>
    </section>
    <details class="pole szanse-panel"><summary>Szanse paczek i kart</summary><div id="szanse"></div></details><section class="pole paczki" id="paczki"></section>
    <div id="sekcje" style="display:flex;flex-direction:column;gap:12px"></div>
  </main>
</div>
<script src="wspolne.js?v=25"></script>
<script src="polandball.js?v=4"></script>
<script src="karty.js?v=23"></script>
<script>
const {$}=ZP;
let D=null,filtr="",WOJ_SVG={},szukaj="",limitWsz=60;
// układ i sortowanie albumu (zapamiętane na telefonie)
const UKLADY=[["woj","Województwa"],["rz","Rzadkość"],["wsz","Wszystkie"]];
const SORTY=[["ovr","Najlepsze OVR"],["rz","Rzadkość"],["nazwa","A–Ż"],["lud","Ludność"],["nowe","Najnowsze"]];
let uklad="woj",sortK="ovr";
try{const u=JSON.parse(localStorage.getItem("album-porzadek")||"{}");if(UKLADY.some(x=>x[0]===u.uklad))uklad=u.uklad;if(SORTY.some(x=>x[0]===u.sort))sortK=u.sort;}catch(e){}
const kolPL=new Intl.Collator("pl");
function porownaj(){
  const KOL=Karty.KOLEJ,w=Karty.widziane(),poz=k=>{const i=w.indexOf(k);return i<0?1e9:i;};
  const ovr=g=>g.ovr==null?-1:Karty.ocenaOVR(g);
  return {ovr:(a,b)=>ovr(b)-ovr(a)||KOL.indexOf(a.rz)-KOL.indexOf(b.rz)||kolPL.compare(a.n,b.n),
    rz:(a,b)=>KOL.indexOf(a.rz)-KOL.indexOf(b.rz)||ovr(b)-ovr(a)||kolPL.compare(a.n,b.n),
    nazwa:(a,b)=>kolPL.compare(a.n,b.n)||a.k.localeCompare(b.k),
    lud:(a,b)=>(b.ludnosc||0)-(a.ludnosc||0)||kolPL.compare(a.n,b.n),
    nowe:(a,b)=>poz(b.k)-poz(a.k)||kolPL.compare(a.n,b.n)}[sortK];
}
function chipy(id,lista,akt,ustaw){
  $(id).innerHTML=lista.map(([v,t])=>'<button type="button" data-v="'+v+'"'+(v===akt?' class="akt" aria-pressed="true"':' aria-pressed="false"')+'>'+t+'</button>').join("");
  $(id).querySelectorAll("button").forEach(b=>b.onclick=()=>{ustaw(b.dataset.v);try{localStorage.setItem("album-porzadek",JSON.stringify({uklad,sort:sortK}));}catch(e){}limitWsz=60;rysuj();});
}
const otwarte=new Set(JSON.parse(localStorage.getItem("album-otwarte")||"[]"));
const zapiszOtwarte=()=>localStorage.setItem("album-otwarte",JSON.stringify([...otwarte]));
function sekcja(id,ikona,tytul,opis,ile,z,tresc,domyslnie){
  const otw=otwarte.has(id)||(domyslnie&&!otwarte.has("!"+id));
  return '<details class="sek" data-id="'+id+'"'+(otw?" open":"")+'><summary><span class="ikona">'+ikona+'</span><span class="tyt"><b>'+tytul+'</b><small>'+opis+'</small>'
    +(z?'<span class="mini-pasek"><i style="width:'+(100*ile/z).toFixed(1)+'%"></i></span>':'')+'</span><span class="licz">'+(z?ile+'/'+z:ile)+'</span><span class="strz">›</span></summary><div class="siatka">'+tresc+'</div></details>';
}
function rysuj(){
  Karty.migracja();
  const st=Karty.zdobyte(),mam=st.mam,w=Karty.widziane(),nowe=[...mam].filter(k=>w.indexOf(k)<0);
  const KOL=Karty.KOLEJ,RZ=Karty.RZ;
  const licz={};KOL.forEach(r=>licz[r]=[0,0]);D.g.forEach(g=>{licz[g.rz][1]++;if(mam.has(g.k))licz[g.rz][0]++;});
  $("ile").textContent=mam.size+" / "+D.g.length;
  {const z=Karty.zetony()%Karty.PACZKA;$("zet").textContent=z+" / "+Karty.PACZKA;$("zetPasek").style.width=(100*z/Karty.PACZKA)+"%";}$("pasek").style.width=(100*mam.size/D.g.length).toFixed(2)+"%";
  $("stan").textContent=mam.size?"stuknij kartę, żeby ją obejrzeć":"zbieraj karty, grając";
  $("rzadkosci").innerHTML=KOL.map(r=>'<button class="rz-'+r+(filtr===r?" akt":"")+'" data-r="'+r+'">'+RZ[r]+'<b>'+licz[r][0]+'/'+licz[r][1]+'</b></button>').join("");
  $("rzadkosci").querySelectorAll("button").forEach(b=>b.onclick=()=>{filtr=filtr===b.dataset.r?"":b.dataset.r;rysuj();});
  chipy("uklad",UKLADY,uklad,v=>uklad=v);chipy("sortuj",SORTY,sortK,v=>sortK=v);
  const q=ZP.norm(szukaj.trim()),trafia=g=>!q||ZP.norm(g.n).includes(q)||ZP.norm(g.powiat||"").includes(q)||ZP.norm(g.woj||"").includes(q);
  const pasuje=g=>(!filtr||g.rz===filtr)&&trafia(g),sort=porownaj();
  let h="";
  const ikNowe='<svg viewBox="0 0 24 24"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.4 7L12 17.6 5.8 21.1l1.4-7L2 9.3l7-.8z"/></svg>';
  if(nowe.length){const l=nowe.map(k=>D.PO_K[k]).filter(Boolean).sort(sort);
    h+=sekcja("nowe",ikNowe,"Nowe karty","od ostatniej wizyty",l.length,0,l.map(g=>Karty.karta(g,{nowa:true})).join(""),true);}
  const woj={};D.g.forEach(g=>{(woj[g.woj]=woj[g.woj]||{wsz:[],mam:[]}).wsz.push(g);if(mam.has(g.k))woj[g.woj].mam.push(g);});
  const mini=g=>Karty.karta(g,{nowa:nowe.indexOf(g.k)>=0});
  if(q){
    // wyszukiwanie: jedna sekcja z trafieniami z całej kolekcji
    const l=D.g.filter(g=>mam.has(g.k)&&pasuje(g)).sort(sort),brak=D.g.filter(g=>!mam.has(g.k)&&pasuje(g)).length;
    h+=sekcja("szukaj",ikNowe,"Wyniki: „"+szukaj.trim().replace(/[<>&"]/g,"").slice(0,30)+"”","w kolekcji "+l.length+(brak?" · jeszcze bez karty: "+brak:""),l.length,0,
      l.map(mini).join("")||'<div class="puste">Nie masz jeszcze takiej karty'+(brak?" ("+brak+" do zdobycia)":"")+'.</div>',true);
  }else if(uklad==="wsz"){
    const l=D.g.filter(g=>mam.has(g.k)&&pasuje(g)).sort(sort);
    h+=sekcja("wszystkie",ikNowe,"Wszystkie karty",SORTY.find(x=>x[0]===sortK)[1].toLowerCase(),l.length,0,
      (l.slice(0,limitWsz).map(mini).join("")||'<div class="puste">Brak kart w tym filtrze.</div>')+(l.length>limitWsz?'<button type="button" class="klocek jasny wiecej-kart" id="wiecejKart">Pokaż kolejne ('+(l.length-limitWsz)+')</button>':''),true);
  }else if(uklad==="rz"){
    KOL.forEach(r=>{const wsz=D.g.filter(g=>g.rz===r),l=wsz.filter(g=>mam.has(g.k)&&pasuje(g)).sort(sort);if(filtr&&filtr!==r)return;
      h+=sekcja("rz-"+r,'<span class="rz-'+r+'" style="display:block;width:28px;height:36px;border-radius:6px;border:2px solid var(--braz)"></span>',Karty.RZ[r],"zebrane: "+wsz.filter(g=>mam.has(g.k)).length+" z "+wsz.length,wsz.filter(g=>mam.has(g.k)).length,wsz.length,
        l.map(mini).join("")||'<div class="puste">Jeszcze żadnej karty tej rzadkości.</div>',r==="legenda"||r==="diament");});
  }else{
    // województwa: najpierw te, w których masz najwięcej kart; w środku według wybranego sortowania
    Object.keys(woj).sort((a,b)=>woj[b].mam.length-woj[a].mam.length||a.localeCompare(b,"pl")).forEach(n=>{
      const x=woj[n],l=x.mam.filter(pasuje).sort(sort);
      const blisko=x.wsz.filter(g=>!mam.has(g.k)&&st.postep[g.k]&&st.postep[g.k].size>=Karty.prog(g)-1&&pasuje(g)).slice(0,4);
      const reszta=x.wsz.filter(g=>!mam.has(g.k)&&pasuje(g)).length-blisko.length;
      const tresc=l.map(mini).join("")
        +blisko.map(g=>Karty.karta(g,{otwarta:false,postep:st.postep[g.k].size})).join("")
        +(reszta>0?'<div class="slot-reszta"><span><b>'+reszta+'</b>kart do zdobycia</span></div>':'');
      h+=sekcja("w-"+n,WOJ_SVG[n]||"",n,x.mam.length?"zebrane karty: "+x.mam.length:"jeszcze żadnej karty",x.mam.length,x.wsz.length,tresc||'<div class="puste">Brak kart w tym filtrze.</div>',false);
    });
  }
  const rzadkie=q?[]:D.g.filter(g=>!mam.has(g.k)&&(["legenda","diament","zloto"].includes(g.rz))&&pasuje(g)).sort(sort).slice(0,12);
  const ikDiam='<svg viewBox="0 0 24 24"><path d="M6 3h12l4 6-10 12L2 9z"/></svg>';
  if(rzadkie.length)h+=sekcja("rzadkie",ikDiam,"Najrzadsze do zdobycia","legendarne, diamentowe i złote karty",rzadkie.length,0,rzadkie.map(g=>Karty.karta(g,{otwarta:false,postep:st.postep[g.k]?st.postep[g.k].size:0})).join(""),false);
  const badges=Karty.odznaki();
  const sets=Object.keys(woj).sort((a,b)=>a.localeCompare(b,"pl")).map(n=>{const all=woj[n].wsz.filter(g=>g.rekordy.length),got=all.filter(g=>mam.has(g.k)).length,earned=badges[D.edycja+":"+n];return '<div class="zestaw-rekordow"><b>'+(earned?'🏅 ':'')+n+'</b><span>'+got+'/'+all.length+'</span><progress value="'+got+'" max="'+(all.length||1)+'"></progress><small>'+(earned?'Odznaka zdobyta · paczka przyznana':'Zbierz wszystkie rekordzistki: odznaka i paczka')+'</small></div>';}).join("");
  h+='<details class="sek"><summary>🏆 Rekordzistki województw · '+Object.keys(badges).length+' odznak</summary><div class="zestawy-rekordow">'+sets+'</div></details>';
  $("sekcje").innerHTML=h;
  // zwijanie i rozwijanie sekcji z pamięcią stanu
  document.querySelectorAll("details.sek").forEach(d=>d.addEventListener("toggle",()=>{const id=d.dataset.id;if(!id)return;if(d.open){otwarte.add(id);otwarte.delete("!"+id);Karty.podepnijMapy(d);}else{otwarte.delete(id);otwarte.add("!"+id);}zapiszOtwarte();}));
  document.querySelectorAll("details.sek[open]").forEach(d=>Karty.podepnijMapy(d));
  document.querySelectorAll("#sekcje .kk").forEach(el=>{Karty.holo(el);el.onclick=()=>podglad(D.PO_K[el.dataset.k],mam.has(el.dataset.k),st);});
  if($("wiecejKart"))$("wiecejKart").onclick=()=>{limitWsz+=60;rysuj();};
  if(nowe.length)localStorage.setItem("karty-widziane",JSON.stringify([...new Set(w.concat(nowe))]));
  rysujPaczki();
}
const KULA_P='<svg viewBox="0 0 40 40"><defs><clipPath id="pkl"><circle cx="20" cy="20" r="17"/></clipPath></defs><g clip-path="url(#pkl)"><rect width="40" height="20" fill="#F4F4F2"/><rect y="20" width="40" height="20" fill="#DC1E35"/></g><circle cx="20" cy="20" r="17" fill="none" stroke="#3A2A14" stroke-width="2.4"/><ellipse cx="14" cy="17" rx="3.4" ry="4.2" fill="#fff" stroke="#3A2A14" stroke-width="1.6"/><ellipse cx="26" cy="17" rx="3.4" ry="4.2" fill="#fff" stroke="#3A2A14" stroke-width="1.6"/></svg>';
function rysujPaczki(){
  const pct=n=>new Intl.NumberFormat("pl-PL",{maximumFractionDigits:1}).format(n*100)+"%";
  $("szanse").innerHTML='<p class="szanse-note">Najpierw losujemy rodzaj paczki, potem rzadkość każdej karty w środku. Lepsza paczka ma więcej kart. Od srebrnej wzwyż w paczce jest co najmniej jedna karta tej rzadkości. Karta, którą już masz, daje '+Karty.DUPLIKAT+' monety.</p><table class="szanse-table"><caption>Szansa na rodzaj paczki</caption><thead><tr><th>Paczka</th><th>Kart</th><th>Szansa</th></tr></thead><tbody>'+Karty.PACZKI.map(([k,p])=>'<tr><td><i class="rarity-dot dot-'+k+'"></i>'+Karty.NAZWA_PACZKI[k]+'</td><td>'+Karty.KART_W_PACZCE[k]+'</td><td>'+pct(p)+'</td></tr>').join("")+'</tbody></table><div class="drop-tabs" role="group" aria-label="Szanse kart w paczce">'+Karty.PACZKI.map(([k])=>'<button type="button" data-drop="'+k+'" aria-pressed="'+(k==='zwykla')+'">'+Karty.NAZWA_PACZKI[k]+'</button>').join("")+'</div><table class="szanse-table"><caption id="drop-caption"></caption><thead><tr><th>Karta</th><th>Szansa</th></tr></thead><tbody id="drop-rows"></tbody></table>';
  const drop=k=>{document.querySelectorAll('[data-drop]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.drop===k)));$("drop-caption").textContent='Każda karta w paczce: '+Karty.NAZWA_PACZKI[k].toLowerCase();$("drop-rows").innerHTML=Karty.DROP[k].map(([r,p])=>'<tr><td><i class="rarity-dot dot-'+r+'"></i>'+Karty.RZ[r]+'</td><td>'+pct(p)+'</td></tr>').join('');};
  document.querySelectorAll('[data-drop]').forEach(b=>b.onclick=()=>drop(b.dataset.drop));drop('zwykla');
  const n=Karty.liczbaPaczek(),z=Karty.zetony()%Karty.PACZKA;
  const cz=Karty.czekajace(),kol=cz.length?cz[0].kolor:"";
  $("paczki").innerHTML='<div class="paczka'+(n?" gotowa":" pusta")+(kol?" pak-"+kol:"")+'">'+KULA_P+(n?'<span class="ile">'+n+'</span>':'')+'</div><div class="opis"><b>'+(n?(n===1?"1 paczka do otwarcia":n+" paczki do otwarcia"):"Brak paczek")+'</b><small>'
    +(n?(kol?Karty.NAZWA_PACZKI[kol]+" paczka czeka: "+Karty.KART_W_PACZCE[kol]+" kart"+(Karty.KART_W_PACZCE[kol]<5?"y":"")+".":"W paczce od 2 do 7 kart, zależnie od jej rodzaju."):"Jeszcze "+(Karty.PACZKA-z)+" monet do następnej paczki.")+'</small>'
    +(n?'<button class="klocek" id="otworz">Otwórz paczkę</button>':'')+'</div>';
  if(n)$("otworz").onclick=otworzPaczke;
}
// otwieranie paczki: potrząśnij, pęka, a potem pełna prezentacja karty
function otworzPaczke(){
  const o=document.createElement("div");o.className="otwieranie";
  o.innerHTML='<p>Stuknij paczkę!</p><div class="paczka gotowa">'+KULA_P+'</div><small>od 2 do 7 kart</small>';
  document.body.appendChild(o);
  const pk=o.querySelector(".paczka");let raz=false;
  pk.onclick=async()=>{
    if(raz)return;raz=true;pk.classList.remove("gotowa");pk.classList.add("trzes");o.querySelector("p").textContent="Otwieranie…";
    if(navigator.vibrate)try{navigator.vibrate([20,30,20,30,60]);}catch(e){}
    let l;try{l=await Karty.otworzPaczke();}catch(e){o.remove();ZP.komunikat("Nie udało się otworzyć paczki");return;}
    if(l&&l.length){const kol=l[0]._kolorPaczki;pk.classList.add("pak-"+kol);o.querySelector("p").textContent=Karty.NAZWA_PACZKI[kol]+" paczka!";o.querySelector("small").textContent=l.length+" kart"+(l.length<5?"y":"")+" w środku";}
    // lepsza paczka trzęsie się dłużej
    const czas=l&&l.length?600+l.length*120:900;
    setTimeout(()=>{pk.classList.remove("trzes");pk.classList.add("peka");},czas);
    setTimeout(()=>{o.remove();if(l&&l.length)Karty.prezentacja(l,()=>rysuj());else rysuj();},czas+500);
  };
}
function podglad(g,otwarta,st){
  const pp=st.postep[g.k]?st.postep[g.k].size:0;
  const d=document.createElement("div");d.className="kk-podglad";
  d.innerHTML='<button type="button" class="close-preview" aria-label="Zamknij podgląd">Zamknij ×</button>'
    +(otwarta?'<div class="kk-flip"><div class="kk-strona przod">'+Karty.karta(g,{tryb:"pelna",otwarta,bezSzczegolow:true})+'</div><div class="kk-strona tyl">'+Karty.tyl(g)+'</div></div>'
      +'<div class="kk-pod">'+Karty.rekordyHTML(g,0,true)+'</div><div class="kk-przyciski"><button type="button" class="klocek odwroc">↻ Odwróć</button>'+Karty.linki(g)+'</div>'
      :Karty.karta(g,{tryb:"pelna",otwarta,bezSzczegolow:true}))
    +'<p>'+(otwarta?""
    :"Zdobędziesz ją od razu w grze Kształt gminy albo trafiając ją "+Karty.prog(g)+" razy w grach gminnych (herby, Gdzie ta gmina?, Ciepło-zimno). Masz: "+pp+"/"+Karty.prog(g)+". Może też wypaść z paczki.")+'</p>';
  d.onclick=e=>{if(e.target===d||e.target.closest(".close-preview"))d.remove();
    // odwracanie: przyciskiem albo stuknięciem w kartę; rekordy pod kartą tylko przy awersie
    else if(e.target.closest(".odwroc")||e.target.closest(".kk-flip")&&!e.target.closest(".kk-pb,a")){const f=d.querySelector(".kk-flip");if(f){f.classList.toggle("odwrocona");d.classList.toggle("tyl-widac");}}};
  document.body.appendChild(d);
  // karta zmniejsza się tak, żeby pod nią zmieściły się wszystkie rekordy, bez przewijania
  const f=d.querySelector(".kk-flip");
  if(f){
    const przod=()=>f.querySelector(".przod .kk"),H=d.clientHeight;
    const zaj=[...d.children].filter(x=>x!==f).reduce((a,x)=>a+x.offsetHeight,0)+10*d.children.length+24;
    f.style.setProperty("--w","300px");f.style.height="auto";
    const r=przod().offsetHeight/300;   // wysokość karty rośnie razem z szerokością
    const w=Math.max(170,Math.min(innerWidth*.8,330,(H-zaj)/r));
    f.style.setProperty("--w",w+"px");f.style.height=przod().offsetHeight+"px";
    // korekta: jeśli coś jeszcze wystaje, zmniejsz kartę o brakującą wysokość
    let ww=w;
    for(let i=0;i<5;i++){
      const nad=d.scrollHeight-d.clientHeight;if(nad<=0||ww<=165)break;
      ww=Math.max(165,ww-nad/(przod().offsetHeight/ww)-2);f.style.setProperty("--w",ww+"px");f.style.height=przod().offsetHeight+"px";
    }
  }Karty.holo(d.querySelector(".kk"));Karty.podepnijMapy(d);
}
Karty.styl();
Promise.all([Karty.zaladuj(),Karty.geometrie(),fetch("woj.geojson?v=17").then(r=>r.json())]).then(([d,_,gj])=>{
  D=d;
  let t=null;$("szukajK").oninput=e=>{clearTimeout(t);t=setTimeout(()=>{szukaj=e.target.value;rysuj();},180);};
  gj.features.forEach(f=>{const P=ZP.projection([f],100,4);WOJ_SVG[f.properties.nazwa]='<svg viewBox="0 0 100 '+P.H.toFixed(0)+'"><path d="'+P.path(f.geometry,0.6)+'"/></svg>';});
  rysuj();
}).catch(e=>{$("stan").textContent="nie udało się wczytać albumu";console.error(e);});
ZP.fitViewport&&ZP.fitViewport();ZP.registerSW();
</script>
