<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Album kart · PolskoZnawca</title>
<meta name="theme-color" content="#0B1530" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@500;700;900&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow-x:hidden}
body{font-family:Rubik,system-ui,sans-serif;color:#EAF0FF;background:#0B1530;
  background-image:radial-gradient(ellipse at 50% -10%,rgba(90,140,255,.35),transparent 55%),radial-gradient(ellipse at 110% 60%,rgba(140,90,255,.18),transparent 50%),
  repeating-linear-gradient(60deg,rgba(255,255,255,.025) 0 2px,transparent 2px 22px),repeating-linear-gradient(-60deg,rgba(255,255,255,.025) 0 2px,transparent 2px 22px),linear-gradient(180deg,#0E1C3E,#070D1E);background-attachment:fixed}
a{color:inherit}
.wrap{max-width:720px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;background:linear-gradient(180deg,rgba(7,13,30,.95),rgba(7,13,30,.8));backdrop-filter:blur(8px);border-bottom:1px solid rgba(160,190,255,.18)}
header a.wstecz{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.08);border:1px solid rgba(160,190,255,.3);text-decoration:none;font-size:22px;font-weight:900}
header h1{flex:1;margin:0;font-family:Bungee,sans-serif;font-weight:400;font-size:20px;letter-spacing:.5px}
header h1 small{display:block;font-family:Rubik,sans-serif;font-weight:700;font-size:11px;color:#9FB4E6;letter-spacing:0}
main{flex:1;padding:12px 12px 40px;display:flex;flex-direction:column;gap:12px}
.postep{background:rgba(255,255,255,.06);border:1px solid rgba(160,190,255,.2);border-radius:16px;padding:12px}
.postep .pasek{height:10px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden;margin:8px 0 10px}
.postep .pasek i{display:block;height:100%;background:linear-gradient(90deg,#5BC0FF,#B98CFF,#FFD15C);border-radius:6px}
.postep .gora{display:flex;justify-content:space-between;align-items:baseline;font-weight:800}
.postep .gora b{font-family:"Barlow Condensed",sans-serif;font-size:26px}
.rzadkosci{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.rzadkosci button{min-width:0;border-radius:12px;border:1px solid rgba(255,255,255,.15);padding:6px 2px;font:800 9px Rubik,sans-serif;color:#14233A;cursor:pointer;overflow:hidden}
.rzadkosci button b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:16px}
.rzadkosci button.akt{outline:3px solid #fff;outline-offset:-2px}
.rz-diament{background:linear-gradient(160deg,#F2FBFF,#BFE6FF 50%,#E6D6FF)}.rz-zloto{background:linear-gradient(160deg,#FFF3C2,#E0A812)}.rz-srebro{background:linear-gradient(160deg,#F7F9FB,#AEB9C4)}.rz-braz{background:linear-gradient(160deg,#F4DCC4,#C98B5C)}.rz-zwykla{background:linear-gradient(160deg,#FBF6E8,#E2D6B8)}
/* sekcje albumu (zwijane) */
details.sek{background:rgba(255,255,255,.05);border:1px solid rgba(160,190,255,.18);border-radius:16px;overflow:hidden}
details.sek[open]{background:rgba(255,255,255,.07)}
details.sek>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;user-select:none}
details.sek>summary::-webkit-details-marker{display:none}
summary .ikona{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:10px;background:rgba(255,255,255,.08)}
summary .ikona svg{width:34px;height:34px}summary .ikona svg path{fill:rgba(140,180,255,.35);stroke:#9FC2FF;stroke-width:1.5;vector-effect:non-scaling-stroke}
summary .tyt{flex:1;min-width:0}
summary .tyt b{display:block;font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:19px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
summary .tyt small{display:block;font-size:11px;color:#9FB4E6;font-weight:700}
summary .mini-pasek{display:block;height:4px;border-radius:2px;background:rgba(255,255,255,.12);margin-top:4px;overflow:hidden}
summary .mini-pasek i{display:block;height:100%;background:#7FB6FF}
summary .licz{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:18px;white-space:nowrap}
summary .strz{font-size:16px;transition:transform .2s;color:#9FB4E6}
details[open]>summary .strz{transform:rotate(90deg)}
.siatka{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px;padding:6px 12px 16px}
@media (min-width:560px){.siatka{grid-template-columns:repeat(3,minmax(0,1fr))}}
.slot-reszta{aspect-ratio:5/7;border-radius:14px;border:2px dashed rgba(160,190,255,.35);display:grid;place-items:center;text-align:center;font-weight:800;color:#9FB4E6;padding:10px;font-size:13px}
.slot-reszta b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:30px;color:#EAF0FF}
.puste{padding:14px;text-align:center;color:#9FB4E6;font-weight:700}
/* podgląd karty po stuknięciu */
.kk-podglad{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;background:rgba(4,8,20,.85);backdrop-filter:blur(6px);animation:wej .2s both}
@keyframes wej{from{opacity:0}}
.kk-podglad .kk{width:min(88vw,380px);animation:obrot .5s cubic-bezier(.3,1.3,.5,1) both}
@keyframes obrot{from{transform:rotateY(160deg) scale(.6)}}
.kk-podglad p{margin:0;max-width:380px;text-align:center;color:#C8D6F5;font-size:13px;font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <header><a class="wstecz" href="./" aria-label="Wróć">‹</a><h1>Album kart<small id="stan">wczytywanie…</small></h1></header>
  <main id="main">
    <section class="postep"><div class="gora"><span>Zebrane karty</span><b id="ile">0 / 2479</b></div><div class="pasek"><i id="pasek" style="width:0"></i></div><div class="rzadkosci" id="rzadkosci"></div></section>
    <div id="sekcje"></div>
  </main>
</div>
<script src="wspolne.js?v=17"></script>
<script src="karty.js?v=3"></script>
<script>
const {$}=ZP;
let D=null,filtr="",WOJ_SVG={};
const otwarte=new Set(JSON.parse(localStorage.getItem("album-otwarte")||"[]"));
const zapiszOtwarte=()=>localStorage.setItem("album-otwarte",JSON.stringify([...otwarte]));
function sekcja(id,ikona,tytul,opis,ile,z,tresc,domyslnie){
  const otw=otwarte.has(id)||(domyslnie&&!otwarte.has("!"+id));
  return '<details class="sek" data-id="'+id+'"'+(otw?" open":"")+'><summary><span class="ikona">'+ikona+'</span><span class="tyt"><b>'+tytul+'</b><small>'+opis+'</small>'
    +(z?'<span class="mini-pasek"><i style="width:'+(100*ile/z).toFixed(1)+'%"></i></span>':'')+'</span><span class="licz">'+(z?ile+'/'+z:ile)+'</span><span class="strz">›</span></summary><div class="siatka">'+tresc+'</div></details>';
}
function rysuj(){
  const st=Karty.zdobyte(),mam=st.mam,w=Karty.widziane(),nowe=[...mam].filter(k=>w.indexOf(k)<0);
  const KOL=Karty.KOLEJ,RZ=Karty.RZ;
  const licz={};KOL.forEach(r=>licz[r]=[0,0]);D.g.forEach(g=>{licz[g.rz][1]++;if(mam.has(g.k))licz[g.rz][0]++;});
  $("ile").textContent=mam.size+" / "+D.g.length;$("pasek").style.width=(100*mam.size/D.g.length).toFixed(2)+"%";
  $("stan").textContent=mam.size?"stuknij kartę, żeby ją obejrzeć":"zbieraj karty, grając";
  $("rzadkosci").innerHTML=KOL.map(r=>'<button class="rz-'+r+(filtr===r?" akt":"")+'" data-r="'+r+'">'+RZ[r]+'<b>'+licz[r][0]+'/'+licz[r][1]+'</b></button>').join("");
  $("rzadkosci").querySelectorAll("button").forEach(b=>b.onclick=()=>{filtr=filtr===b.dataset.r?"":b.dataset.r;rysuj();});
  const pasuje=g=>!filtr||g.rz===filtr,sort=(a,b)=>KOL.indexOf(a.rz)-KOL.indexOf(b.rz)||a.ludnosc-b.ludnosc;
  let h="";
  const ikNowe='<svg viewBox="0 0 24 24"><path d="M12 2l3 6.5 7 .8-5.2 4.8 1.4 7L12 17.6 5.8 21.1l1.4-7L2 9.3l7-.8z"/></svg>';
  if(nowe.length){const l=nowe.map(k=>D.PO_K[k]).filter(Boolean).sort(sort);
    h+=sekcja("nowe",ikNowe,"Nowe karty","od ostatniej wizyty",l.length,0,l.map(g=>Karty.karta(g,{nowa:true})).join(""),true);}
  // województwa: najpierw te, w których masz najwięcej kart
  const woj={};D.g.forEach(g=>{(woj[g.woj]=woj[g.woj]||{wsz:[],mam:[]}).wsz.push(g);if(mam.has(g.k))woj[g.woj].mam.push(g);});
  Object.keys(woj).sort((a,b)=>woj[b].mam.length-woj[a].mam.length||a.localeCompare(b,"pl")).forEach(n=>{
    const x=woj[n],l=x.mam.filter(pasuje).sort(sort);
    const blisko=x.wsz.filter(g=>!mam.has(g.k)&&st.postep[g.k]&&st.postep[g.k].size>=Karty.PROG-1&&pasuje(g)).slice(0,4);
    const reszta=x.wsz.filter(g=>!mam.has(g.k)&&pasuje(g)).length-blisko.length;
    const tresc=l.map(g=>Karty.karta(g,{nowa:nowe.indexOf(g.k)>=0})).join("")
      +blisko.map(g=>Karty.karta(g,{otwarta:false,postep:st.postep[g.k].size})).join("")
      +(reszta>0?'<div class="slot-reszta"><span><b>'+reszta+'</b>kart do zdobycia</span></div>':'');
    h+=sekcja("w-"+n,WOJ_SVG[n]||"",n,x.mam.length?"zebrane karty: "+x.mam.length:"jeszcze żadnej karty",x.mam.length,x.wsz.length,tresc||'<div class="puste">Brak kart w tym filtrze.</div>',false);
  });
  const rzadkie=D.g.filter(g=>!mam.has(g.k)&&(g.rz==="diament"||g.rz==="zloto")&&pasuje(g)).sort(sort).slice(0,12);
  const ikDiam='<svg viewBox="0 0 24 24"><path d="M6 3h12l4 6-10 12L2 9z"/></svg>';
  if(rzadkie.length)h+=sekcja("rzadkie",ikDiam,"Najrzadsze do zdobycia","diamentowe i złote karty",rzadkie.length,0,rzadkie.map(g=>Karty.karta(g,{otwarta:false,postep:st.postep[g.k]?st.postep[g.k].size:0})).join(""),false);
  $("sekcje").innerHTML=h;
  // zwijanie i rozwijanie sekcji z pamięcią stanu
  document.querySelectorAll("details.sek").forEach(d=>d.addEventListener("toggle",()=>{const id=d.dataset.id;if(d.open){otwarte.add(id);otwarte.delete("!"+id);Karty.podepnijMapy(d);}else{otwarte.delete(id);otwarte.add("!"+id);}zapiszOtwarte();}));
  document.querySelectorAll("details.sek[open]").forEach(d=>Karty.podepnijMapy(d));
  document.querySelectorAll("#sekcje .kk").forEach(el=>{Karty.holo(el);el.onclick=()=>podglad(D.PO_K[el.dataset.k],mam.has(el.dataset.k),st);});
  if(nowe.length)localStorage.setItem("karty-widziane",JSON.stringify([...new Set(w.concat(nowe))]));
}
function podglad(g,otwarta,st){
  const pp=st.postep[g.k]?st.postep[g.k].size:0;
  const d=document.createElement("div");d.className="kk-podglad";
  d.innerHTML=Karty.karta(g,{tryb:"pelna",otwarta})+'<p>'+(otwarta?"Dane: GUS BDL, PRG · mapa © współtwórcy OpenStreetMap, OpenTopoMap · stuknij, by zamknąć"
    :"Zdobędziesz ją, odgadując po konturze (Do sześciu razy sztuka, Kształt gminy) albo trafiając w "+Karty.PROG+" różnych grach. Masz: "+pp+"/"+Karty.PROG+".")+'</p>';
  d.onclick=()=>d.remove();document.body.appendChild(d);Karty.holo(d.querySelector(".kk"));Karty.podepnijMapy(d);
}
Karty.styl();
Promise.all([Karty.zaladuj(),Karty.geometrie(),fetch("woj.geojson?v=17").then(r=>r.json())]).then(([d,_,gj])=>{
  D=d;
  gj.features.forEach(f=>{const P=ZP.projection([f],100,4);WOJ_SVG[f.properties.nazwa]='<svg viewBox="0 0 100 '+P.H.toFixed(0)+'"><path d="'+P.path(f.geometry,0.6)+'"/></svg>';});
  rysuj();
}).catch(e=>{$("stan").textContent="nie udało się wczytać albumu";console.error(e);});
ZP.fitViewport&&ZP.fitViewport();ZP.registerSW();
</script>
</body>
</html>
