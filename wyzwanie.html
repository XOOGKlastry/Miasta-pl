<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<title>Wyzwanie · PolskoZnawca</title>
<meta name="theme-color" content="#0A181B" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<link rel="stylesheet" href="wspolne.css?v=16" />
<style>
svg path{fill-rule:evenodd}
/* segmenty postępu */
.segmenty{display:flex;gap:4px;flex:none}
.segmenty i{flex:1;height:6px;border-radius:3px;background:var(--line);transition:background .4s,transform .4s}
.segmenty i.teraz{background:var(--paper);transform:scaleY(1.4)}
.segmenty i.g{background:var(--ok)}.segmenty i.y{background:var(--warn)}.segmenty i.r{background:var(--red)}
.gora{display:flex;align-items:center;gap:10px;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);
  background:rgba(242,193,78,.1);border:1px solid rgba(242,193,78,.35);border-radius:999px;padding:4px 10px}
.pkt{margin-left:auto;font-family:"Fraunces",serif;font-weight:900;font-size:22px;color:var(--gold);font-variant-numeric:tabular-nums}
.pytanie{flex:none;font-family:"Fraunces",serif;font-weight:900;font-size:clamp(24px,7.5vw,34px);line-height:1.08;letter-spacing:-.01em;overflow-wrap:anywhere}
.stage{flex:1;min-height:150px;position:relative;display:grid;place-items:center;animation:wejscie .35s both}
.stage>*{grid-area:1/1}
#mapa{position:absolute;inset:0}
#ksztalt,#rzekaMapa{position:absolute;inset:0;width:100%;height:100%}
#rzekaMapa .w{fill:#1D3D43;stroke:#4F7F86;stroke-width:1;vector-effect:non-scaling-stroke}
#rzekaMapa .rz{fill:none;stroke:#5AA9E6;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;stroke-dasharray:2000;stroke-dashoffset:2000;animation:rysuj 1.4s ease-out forwards}
#rzekaMapa .dot{fill:var(--gold);stroke:var(--ink);stroke-width:2;vector-effect:non-scaling-stroke}
@keyframes rysuj{to{stroke-dashoffset:0}}
#lot{position:absolute;inset:0}
.tablica{display:flex;height:84px;border:3px solid #111;border-radius:9px;background:#F4F4F2;overflow:hidden;box-shadow:0 10px 28px rgba(0,0,0,.4)}
.tablica i{width:38px;background:#1546B8;display:grid;place-items:end center;color:#fff;font:700 14px/1 "Space Grotesk";padding-bottom:7px;font-style:normal}
.tablica span{padding:0 26px;display:grid;place-items:center;color:#111;font:700 54px/1 "Space Grotesk",sans-serif;letter-spacing:.06em}
.para{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px;text-align:center}
.para b{font-family:"Fraunces",serif;font-weight:900;font-size:clamp(24px,8vw,34px);line-height:1.05}
.para span{color:var(--dim);font-size:13px}
.para em{font-style:normal;color:var(--gold);font-weight:700;font-size:14px;letter-spacing:.1em}
#paraMapa{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px)}
#paraMapa path{fill:#1D3D43;stroke:#4F7F86;stroke-width:1;vector-effect:non-scaling-stroke}
#paraMapa path.a{fill:rgba(242,193,78,.55);stroke:var(--gold)}#paraMapa path.b{fill:rgba(127,216,198,.55);stroke:var(--teal)}
#paraMapa text{font-family:"Fraunces",serif;font-weight:700;font-size:14px;text-anchor:middle;fill:#fff;paint-order:stroke;stroke:#0A181B;stroke-width:4px}
.answers.dwa{grid-template-columns:1fr 1fr}
#foto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#herbImg{max-width:72%;max-height:86%;object-fit:contain;filter:drop-shadow(0 6px 14px rgba(0,0,0,.25))}
.stage.jasna{background:#E9EEEC}
.podpis{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 6px;font-size:10.5px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.65));pointer-events:none}
.miasto-duze{font-family:"Fraunces",serif;font-weight:900;font-size:clamp(30px,10vw,46px);text-align:center;padding:0 16px}
.karty2{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;padding:10px;align-self:stretch}
.karty2 .k{background:var(--ink-3);border:1px solid var(--line-2);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:14px 8px;text-align:center}
.karty2 .k b{font-family:"Fraunces",serif;font-size:22px;line-height:1.1}
.karty2 .k small{color:var(--dim);font-size:12px}
.karty2 .k .lud{font-family:"Fraunces",serif;font-size:22px;color:var(--gold);min-height:28px}
.karty2 .k button{min-height:50px;width:100%;margin-top:4px}
.karty2 .k.dobrze{border-color:var(--ok);background:#153A33}.karty2 .k.zle{border-color:var(--red);background:#3A1A22}
#okBtn{width:100%}
.leaflet-container{background:#1b1b1b;font-family:inherit}
.leaflet-bar a{background:var(--ink-2);color:var(--paper);border-color:var(--line-2)}
.cel-lbl{background:var(--gold);color:var(--gold-ink);border:none;font-family:"Fraunces",serif;font-weight:700;font-size:14px;padding:2px 8px;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.cel-lbl::before{display:none}

/* ekran startowy */
.start{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;justify-content:center;animation:wejscie .4s both}
.odznaka-d{align-self:flex-start;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:6px 12px;border-radius:999px;
  background:linear-gradient(90deg,var(--gold),#FF9E6B,var(--teal),var(--gold));background-size:300% 100%;color:var(--gold-ink);animation:tecza 6s linear infinite}
@keyframes tecza{to{background-position:300% 0}}
.start h2{font-family:"Fraunces",serif;font-weight:900;font-size:clamp(38px,12vw,58px);line-height:.98;margin:0;letter-spacing:-.02em}
.start p{margin:0;color:var(--dim);font-size:15.5px}
.typy{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.typy div{background:var(--ink-2);border:1px solid var(--line-2);border-radius:14px;padding:10px 6px;text-align:center;font-size:12px;color:var(--dim)}
.typy div span{display:block;font-size:26px;margin-bottom:2px}
.start .big{min-height:60px;font-size:19px}

/* wynik */
.wynik{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;animation:wejscie .4s both}
.wynik .ranga{font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--teal)}
.wynik .suma{font-family:"Fraunces",serif;font-weight:900;font-size:clamp(56px,18vw,86px);line-height:.95;letter-spacing:-.03em}
.wynik .suma span{font-size:22px;color:var(--dim);font-weight:600}
.kafle{display:flex;gap:6px;flex-wrap:wrap}
.kafle i{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-style:normal;font-size:16px;animation:wejscie .3s both}
.kafle i.g{background:var(--ok)}.kafle i.y{background:var(--warn)}.kafle i.r{background:var(--red)}
.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.meta div{background:var(--ink-2);border:1px solid var(--line);border-radius:14px;padding:10px;font-size:12px;color:var(--dim)}
.meta b{display:block;font-family:"Fraunces",serif;font-size:22px;color:var(--paper)}
.wynik .rows{flex:1}
.mp-kod{font-family:"Fraunces",serif;font-weight:900;font-size:64px;letter-spacing:.14em;text-align:center;color:var(--gold);line-height:1}
.mp-gracze{display:flex;flex-direction:column;gap:6px}
.mp-gracz{display:flex;align-items:center;gap:10px;background:var(--ink-2);border:1px solid var(--line);border-radius:14px;padding:9px 12px;animation:wejscie .3s both}
.mp-gracz .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:19px;flex:none}
.mp-gracz b{flex:1;font-size:16px}.mp-gracz.ja{border-color:var(--gold)}
.mp-gracz .pkt{font-family:"Fraunces",serif;font-weight:900;font-size:20px;color:var(--gold)}
.mp-stan{font-size:12.5px;color:var(--dim);margin-top:4px}.mp-stan b{color:var(--gold)}
.mp-tabela{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.mp-tabela span{background:var(--ink-3);border-radius:999px;padding:2px 8px;font-size:11.5px;color:var(--paper)}.mp-tabela span.ja{background:var(--gold);color:var(--gold-ink)}
.mp-podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;height:180px}
.mp-podium div{flex:1;max-width:120px;border-radius:14px 14px 0 0;display:flex;flex-direction:column;align-items:center;padding-top:10px;gap:4px;animation:rosnij .7s cubic-bezier(.2,.7,.3,1) both}
.mp-podium .m1{height:100%;background:linear-gradient(180deg,var(--gold),#B88A1F);color:var(--gold-ink)}
.mp-podium .m2{height:74%;background:#9FB3B1;color:#10292c;animation-delay:.15s}
.mp-podium .m3{height:56%;background:#B7784A;color:#2A1804;animation-delay:.3s}
.mp-podium b{font-size:15px;text-align:center}.mp-podium span{font-size:26px}
@keyframes rosnij{from{transform:scaleY(0);transform-origin:bottom}to{transform:none}}
#lobby{justify-content:flex-start;gap:12px;overflow:auto}
/* konfigurator rozgrywki */
.konfig{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;animation:wejscie .3s both}
.konfig h2{font-family:"Fraunces",serif;font-weight:900;font-size:26px;margin:0}
.presety{display:flex;gap:6px;overflow-x:auto;flex:none;scrollbar-width:none}.presety::-webkit-scrollbar{display:none}
.presety button{flex:none;border-radius:999px;border:1px solid var(--line-2);background:var(--ink-2);padding:7px 12px;font-size:13px;font-weight:700;white-space:nowrap}
.presety button.akt{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.lista-gier{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:5px}
.wg{display:grid;grid-template-columns:30px 1fr auto auto;gap:8px;align-items:center;background:var(--ink-2);border:1px solid var(--line);border-radius:12px;padding:6px 8px;transition:opacity .2s,border-color .2s}
.wg.off{opacity:.45}.wg.on{border-color:var(--line-2)}
.wg .ik{font-size:20px;text-align:center}
.wg b{font-size:14px}
.stepper{display:flex;align-items:center;gap:2px}
.stepper button,.kol button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line-2);background:var(--ink-3);font-size:17px;font-weight:700;line-height:1}
.stepper span{min-width:24px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums;color:var(--gold)}
.kol{display:flex;gap:2px}
.kol button{width:28px;font-size:13px}
.opcje-k{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:none}
.opcje-k label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.opcje-k select{min-height:40px;padding:6px 10px;font-size:14px;text-transform:none;letter-spacing:0}
.chipy-k{display:flex;gap:5px;flex-wrap:wrap}
.chipy-k button{border-radius:999px;border:1px solid var(--line-2);background:var(--ink-2);padding:5px 10px;font-size:12.5px}
.chipy-k button.akt{background:#24413F;border-color:var(--gold);color:var(--gold)}
.obsz-btn{flex:none;min-height:40px;font-size:13.5px;text-align:left;padding:0 12px}
.podsum{flex:none;font-size:13px;color:var(--dim);text-align:center}.podsum b{color:var(--gold)}
/* kto już odpowiedział (na żywo) */
.mp-pasek{display:flex;gap:3px;margin-left:6px}
.mp-pasek i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-style:normal;opacity:.3;filter:grayscale(1);transition:opacity .2s,filter .2s,transform .2s;position:relative}
.mp-pasek i.jest{opacity:1;filter:none;animation:odpowiedzial .5s}
.mp-pasek i.jest::after{content:"✓";position:absolute;right:-3px;bottom:-3px;width:12px;height:12px;border-radius:50%;background:var(--ok);color:#06231A;font-size:9px;font-weight:900;display:grid;place-items:center}
@keyframes odpowiedzial{0%{transform:scale(1)}40%{transform:scale(1.45)}100%{transform:scale(1)}}
.mp-dymek{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:900;background:rgba(10,24,27,.92);border:1px solid var(--ok);color:var(--paper);border-radius:999px;padding:5px 12px;font-size:13px;white-space:nowrap;animation:dymek 1.8s both;pointer-events:none}
@keyframes dymek{0%{opacity:0;transform:translate(-50%,-6px)}12%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}
#wpis.bez-podp .pokaz{display:none}
.saga-wynik{display:flex;flex-direction:column;gap:12px;flex:1;min-height:0;text-align:center}
.saga-wynik h2{font-family:"Fraunces",serif;font-weight:900;font-size:34px;margin:0}
.saga-wynik p{margin:0;color:var(--dim)}
.saga-gw{display:flex;justify-content:center;gap:10px;margin-top:10px}
.saga-gw span{font-size:64px;line-height:1;color:#2E4A4F;transform:scale(.8)}
.saga-gw span:nth-child(2){font-size:80px;margin-top:-14px}
.saga-gw span.zdobyta{color:#FFC93C;text-shadow:0 4px 0 #B8860B;animation:gwiazda .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes gwiazda{0%{transform:scale(0) rotate(-40deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.saga-odbl{background:rgba(93,202,165,.15);border:1px solid var(--ok);border-radius:14px;padding:10px;font-size:14px}
.saga-odbl.nie{background:rgba(224,70,90,.12);border-color:var(--red)}
.saga-wynik .btnrow a{flex:1;display:grid;place-items:center;text-decoration:none;min-height:54px;color:inherit}
.saga-wynik>a.ghost{color:inherit}
.saga-wynik .btnrow a.big{color:var(--gold-ink)}
.pojedynek-wynik{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:var(--ink-2);border:1px solid var(--line-2);border-radius:16px;padding:10px 14px;animation:wejscie .4s .3s both}
.pojedynek-wynik div{text-align:center}.pojedynek-wynik small{display:block;color:var(--dim);font-size:12px}
.pojedynek-wynik b{font-family:"Fraunces",serif;font-size:26px}
.pojedynek-wynik span{font-size:30px}
.pojedynek-wynik.wygr{border-color:var(--ok)}.pojedynek-wynik.przegr{border-color:var(--red)}
.pojedynek-opis{margin:0;font-size:13.5px;color:var(--dim)}
</style>
</head>
<body>
<div class="app">

<header>
  <a class="back" href="./" aria-label="Wróć do listy gier">‹</a>
  <h1 id="tytul">Wyzwanie dnia</h1>
  <span class="round" id="runda"></span>
</header>

<main>
  <section class="setup hidden" id="setup">
    <div id="stareUst" class="hidden">
      <div id="scope"></div>
      <select id="rounds"><option value="11">11</option><option value="22" selected>22</option><option value="33">33</option></select>
      <button id="startBtn" disabled></button>
      <span id="datastate"></span>
    </div>
  </section>

  <section class="start hidden" id="start">
    <span class="odznaka-d" id="odznaka">Wyzwanie dnia</span>
    <h2 id="startTytul">Osiem pytań,<br>jedna próba</h2>
    <p id="startOpis">Każdego dnia ten sam zestaw dla wszystkich. Porównaj wynik ze znajomymi.</p>
    <div class="typy" id="typyLista">
      <div><span>🛰️</span>Z lotu ptaka</div><div><span>📍</span>Gdzie to jest?</div><div><span>📷</span>Co to za miasto?</div>
      <div><span>🗺️</span>Kształt powiatu</div><div><span>🛡️</span>Herb</div><div><span>🚗</span>Tablice</div>
      <div><span>⚖️</span>Więcej czy mniej</div><div><span>🌊</span>Rzeka</div><div id="typyWiecej" class="hidden"><span>⚽🤝🧭</span>Kluby, granice, województwa</div>
    </div>
    <button class="big" id="zaczynam" disabled>Wczytywanie…</button>
    <div class="datastate" id="stanDanych"></div>
  </section>

  <div class="segmenty hidden" id="segmenty"></div>
  <div class="gora hidden" id="gora"><span class="chip" id="chip"></span><span class="mp-pasek" id="mpPasek"></span><span class="pkt" id="suma">0</span></div>
  <div class="pytanie hidden" id="pytanie"></div>
  <div class="tbar hidden" id="tbar"><i id="tfill"></i></div>
  <section class="stage hidden" id="stage">
    <div id="mapa" class="hidden"></div>
    <div id="lot" class="hidden"></div>
    <div class="tablica hidden" id="tablica"><i>PL</i><span id="tablicaKod"></span></div>
    <div class="para hidden" id="para"></div>
    <svg id="ksztalt" class="hidden" preserveAspectRatio="xMidYMid meet"></svg>
    <svg id="rzekaMapa" class="hidden" preserveAspectRatio="xMidYMid meet"></svg>
    <img id="foto" class="hidden" alt="Zdjęcie miasta" />
    <img id="herbImg" class="hidden" alt="Herb" />
    <div class="miasto-duze hidden" id="miastoDuze"></div>
    <div class="karty2 hidden" id="karty2"></div>
    <div class="podpis hidden" id="podpis"></div>
  </section>
  <div class="answers hidden" id="answers"></div>
  <div class="wpis hidden" id="wpis"></div>
  <button class="big hidden" id="okBtn" disabled>Zatwierdź</button>
  <div class="feedback hidden" id="feedback"></div>

  <section class="wynik hidden" id="wynik"></section>
  <section class="start hidden" id="lobby"></section>
  <section class="konfig hidden" id="konfig"></section>
</main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="konto.js"></script>
<script src="saga.js"></script>
<script src="tablice-powiaty.js"></script>
<script src="peerjs.min.js"></script>
<script src="topojson-client.min.js?v=16"></script>
<script src="efekty.js?v=2"></script>
<script src="wspolne.js?v=16"></script>
<script>
const {$,fmt}=ZP;
const URLP=new URLSearchParams(location.search);
const TRYB=["turniej","pojedynek","saga","kostka"].indexOf(URLP.get("tryb"))>=0?URLP.get("tryb"):"dzien";
const MULTI=TRYB==="pojedynek"?{host:false,conns:{},gracze:[],ja:{id:"",nick:localStorage.getItem("nick")||"",aw:(window.Konto?Konto.profil().awatar:"🦊")},peer:null,kod:"",gra:null}:null;
// wyzwanie od znajomego: te same pytania (ziarno i ustawienia w linku) i jego wynik do pobicia
let RYWAL=URLP.get("od")?{nick:URLP.get("od").slice(0,20),wynik:+URLP.get("wynik")||0,nr:+URLP.get("nr")||0}:null;
let ZIARNO=URLP.get("seed")||"";
const DZIEN=ZP.dayKey(),START=new Date(2026,8,20);
const NR=Math.floor((new Date(DZIEN+"T12:00:00")-START)/864e5)+1;
const KLUCZ="dzis-"+DZIEN;
const TYPY={z:["🛰️","Z lotu ptaka"],g:["📍","Gdzie to jest?"],k:["🗺️","Kształt powiatu"],h:["🛡️","Jaki to herb?"],m:["📷","Co to za miasto?"],r:["🌊","Nad jaką rzeką?"],w:["⚖️","Więcej czy mniej?"],
  t:["🚗","Tablice"],c:["⚽","Jaki to klub?"],s:["🤝","Graniczą czy nie?"],v:["🧭","Województwo"]};
// kolejność konkurencji: wyzwanie dnia (8 pytań) i turniej (wszystkie gry po kolei)
const KOLEJ_DZIEN=["z","g","m","k","h","t","w","r"],KOLEJ_TURNIEJ=["z","g","m","k","h","t","r","c","w","s","v"];
const SCORE=km=>Math.round(1000*Math.exp(-km/150));
const kolor=p=>p>=700?"g":p>=300?"y":"r";
const RANGI=[[85,"Geograf roku"],[70,"Kartograf"],[50,"Przewodnik"],[30,"Krajoznawca"],[0,"Turysta"]];
let D={},Q=[],st=null,map=null,warstwy=null,POLE=null,PL=null,baseSvg="",lotMap=null,lotZnacznik=null;

/* ---------- dane ---------- */
async function laduj(){
  const pob=(u,d)=>fetch(u,{cache:"no-cache"}).then(r=>r.ok?r.json():d).catch(()=>d);
  const [woj,pw,hj,mj,rj,popr,kj]=await Promise.all([ZP.loadWoj(),ZP.loadPowiaty(),pob("herby.json",{miasta:[]}),pob("miejsca.json",{miasta:[]}),pob("rzeki.json",{miasta:[]}),ZP.poprawki(),pob("kluby.json",{kluby:[]})]);
  D.woj=woj;D.pow=pw.filter(p=>!p.city);D.powAll=pw;
  D.kluby=(kj.kluby||[]).filter(k=>k.lat!=null);
  D.tab=(window.POWIATY||[]).map(p=>Object.assign({},p,{wojN:p.woj}));
  D.herby=ZP.popHerby((hj.miasta||[]).map(c=>({n:c.n,lat:c.lat,lon:c.lon,pop:c.pop,img:c.img})),popr,c=>c.n);
  D.miejsca=(mj.miasta||[]).filter(c=>c.zdjecia&&c.zdjecia.length);
  D.rzeki=ZP.popRzeki(rj.miasta||[],popr);
  D.miasta=ZP.FALLBACK.map(([n,lat,lon,pop])=>({n,lat,lon,pop}));
  PL=ZP.projection(woj.map(w=>w.f),500,8);
  baseSvg=woj.map(w=>'<path class="w" d="'+PL.path(w.f.geometry)+'"/>').join("");
}
function losuj(rnd,a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function czteryNaj(rnd,c,pool,klucz){
  const near=pool.filter(o=>klucz(o)!==klucz(c)).sort((x,y)=>ZP.km(c,x)-ZP.km(c,y));
  const o=[],s=new Set([klucz(c)]);
  for(const x of near){if(s.has(klucz(x)))continue;s.add(klucz(x));o.push(klucz(x));if(o.length===7)break;}
  return losuj(rnd,losuj(rnd,o).slice(0,3).concat([klucz(c)]));
}
function budujPytania(rnd,ile,filtr,kolej){
  filtr=filtr||(()=>true);kolej=kolej||KOLEJ_TURNIEJ;
  const wObsz=x=>!ZP.OBSZAR.length||ZP.wObszarze(x);
  const miasta=D.miasta.filter(filtr),herby=D.herby.filter(filtr),miejsca=D.miejsca.filter(filtr),rzeki=D.rzeki.filter(filtr),pow=D.pow.filter(wObsz);
  const kluby=D.kluby.filter(k=>wObsz(k)),tab=D.tab.filter(p=>!ZP.OBSZAR.length||ZP.OBSZAR.indexOf(p.woj)>=0),powAll=D.powAll.filter(wObsz);
  const lista={z:losuj(rnd,miasta),g:losuj(rnd,miasta),k:losuj(rnd,pow),h:losuj(rnd,herby),m:losuj(rnd,miejsca),r:losuj(rnd,rzeki),w:losuj(rnd,miasta.filter(c=>c.pop>0)),
    t:losuj(rnd,tab),c:losuj(rnd,[...new Map(kluby.map(k=>[k.miasto,k])).values()]),s:losuj(rnd,powAll.filter(p=>p.nb&&p.nb.length)),v:losuj(rnd,miasta)};
  const qs=[],skrot=k=>k.klub;
  for(let i=0;qs.length<ile&&i<ile*4;i++){
    const t=kolej[i%kolej.length],src=lista[t];if(!src||!src.length)continue;
    const c=src.shift();
    if(t==="z")qs.push({t,c,opcje:czteryNaj(rnd,c,D.miasta,x=>x.n),dx:(rnd()-.5)*0.01,dy:(rnd()-.5)*0.008});
    if(t==="g")qs.push({t,c});
    if(t==="k")qs.push({t,p:c,opcje:czteryNaj(rnd,c,D.pow,x=>x.label)});
    if(t==="h")qs.push({t,c,opcje:czteryNaj(rnd,c,D.herby,x=>x.n)});
    if(t==="m")qs.push({t,c,foto:c.zdjecia[Math.floor(rnd()*c.zdjecia.length)],opcje:czteryNaj(rnd,c,D.miejsca,x=>x.n)});
    if(t==="r")qs.push({t,c,opcje:czteryNaj(rnd,c,D.rzeki,x=>x.rzeka)});
    if(t==="w"){const b=src.find(x=>Math.abs(x.pop-c.pop)/Math.min(x.pop,c.pop)>0.08);if(b){src.splice(src.indexOf(b),1);qs.push({t,a:c,b});}}
    if(t==="t"){const inne=losuj(rnd,D.tab.filter(x=>x.woj===c.woj&&x.kod!==c.kod)).slice(0,3).map(x=>x.nazwa);qs.push({t,p:c,opcje:losuj(rnd,inne.concat([c.nazwa]))});}
    if(t==="c"){
      // pytamy o miasto, odpowiedzią jest krótka nazwa klubu (bez nazwy miasta, żeby nie zdradzać)
      const wMiescie=D.kluby.filter(k=>k.miasto===c.miasto),krotkie=new Set(wMiescie.map(k=>ZP.norm(skrot(k))));
      const inne=[...new Set(losuj(rnd,D.kluby.filter(k=>!krotkie.has(ZP.norm(skrot(k))))).map(skrot))].slice(0,3);
      qs.push({t,c:{n:c.miasto,lat:c.lat,lon:c.lon},kluby:wMiescie,opcje:losuj(rnd,inne.concat([skrot(c)]))});
    }
    if(t==="s"){
      const sas=rnd()<0.5,kand=sas?D.powAll.filter(x=>c.nb.indexOf(x.k)>=0):D.powAll.filter(x=>x!==c&&c.nb.indexOf(x.k)<0&&ZP.km(c,x)<90);
      if(kand.length)qs.push({t,a:c,b:kand[Math.floor(rnd()*kand.length)],sas});
    }
    if(t==="v"){const w=ZP.wojOf(c.lon,c.lat);if(w)qs.push({t,c,woj:w,opcje:losuj(rnd,losuj(rnd,Object.values(ZP.WOJ_KOD).filter(x=>x!==w)).slice(0,3).concat([w]))});}
  }
  return qs;
}

/* ---------- start ---------- */
function zapisane(){try{return JSON.parse(localStorage.getItem(KLUCZ)||"null");}catch(e){return null;}}
let POZIOM=null;
function krainaStart(){
  // poziom planszy przygód albo rzut kostką: gotowa konfiguracja, bez konfiguratora
  const reszta=gry=>gry.concat(WSZYSTKIE.filter(t=>!gry.some(g=>g.t===t)).map(t=>({t,ile:0})));
  if(TRYB==="saga"){
    POZIOM=Saga.poziom(Math.max(0,Math.min(Saga.ILE-1,+(URLP.get("poziom")||0))));
    KONFIG={preset:"",gry:reszta(POZIOM.gry),kolej:"przeplatane",czas:0,podp:true,premia:false,wielk:"dsm",obszar:[POZIOM.woj]};
    $("tytul").textContent="Poziom "+(POZIOM.n+1);document.title="Poziom "+(POZIOM.n+1)+" · PolskoZnawca";
    $("odznaka").textContent=POZIOM.kraina.nazwa+" · poziom "+(POZIOM.nrWSwiecie+1)+" z "+Saga.NA_SWIAT;
    $("startTytul").innerHTML=(POZIOM.boss?"Stolica regionu:<br>"+POZIOM.kraina.stolica:POZIOM.nazwa);
    const s=Saga.stan(),gw=s.gw[POZIOM.n]||0;
    $("startOpis").innerHTML=POZIOM.pytan+" pytań z województwa "+POZIOM.woj+". "+(POZIOM.boss?"Potrzebujesz 2 gwiazdek, żeby wyruszyć do kolejnej krainy.":"Zdobądź choć jedną gwiazdkę, żeby iść dalej.")+(gw?"<br>Twój rekord: "+"★".repeat(gw)+"☆".repeat(3-gw):"");
  }else{
    const f=Saga.KOSTKA.find(k=>k.id===URLP.get("kat"))||Saga.KOSTKA[0];
    KONFIG={preset:"",gry:reszta(f.gry.map(([t,ile])=>({t,ile}))),kolej:"losowo",czas:0,podp:true,premia:false,wielk:"dsm",obszar:[]};
    $("tytul").textContent="Rzut kostką";$("odznaka").textContent="Kostka wskazała: "+f.nazwa;
    $("startTytul").innerHTML=f.nazwa+"!";$("startOpis").textContent="Pięć szybkich pytań z tej kategorii, z całej Polski.";
  }
  $("typyLista").innerHTML=KONFIG.gry.filter(g=>g.ile).map(g=>'<div><span>'+TYPY[g.t][0]+'</span>'+TYPY[g.t][1]+' ×'+g.ile+'</div>').join("");
  $("start").classList.remove("hidden");
}

  if(TRYB==="saga"||TRYB==="kostka"){krainaStart();$("stanDanych").textContent="Wczytywanie…";await laduj();$("stanDanych").textContent="";$("zaczynam").disabled=false;$("zaczynam").textContent="Graj";return;}
  if(MULTI){$("tytul").textContent="Kto pierwszy, ten lepszy";document.title="Kto pierwszy, ten lepszy · PolskoZnawca";lobbyStart();laduj();return;}
  if(TRYB==="turniej"){
    $("tytul").textContent="Turniej";
    document.title="Turniej · PolskoZnawca";
    $("odznaka").textContent="Turniej";
    $("startTytul").innerHTML="Wszystkie gry<br>w jednym turnieju";
    $("startOpis").textContent="Z lotu ptaka, mapa, zdjęcia, kształty, herby, tablice, rzeki, kluby, granice i więcej. Liczy się najlepszy wynik.";
    ZP.zakresy($("scope"));
    $("tytul").textContent="Własna gra";document.title="Własna gra · PolskoZnawca";$("odznaka").textContent="Własna gra";
    const zLinku=URLP.get("k")&&zKodu(URLP.get("k"));
    if(ZIARNO&&(zLinku||URLP.get("w"))){
      // link z wyzwaniem: te same ustawienia i pytania, bez konfiguratora
      if(zLinku)KONFIG=zLinku;else{KONFIG=nowaKonfig("Turniej");KONFIG.wielk=URLP.get("w")||"dsm";KONFIG.obszar=(URLP.get("o")||"").split(",").filter(Boolean);}
      $("startOpis").innerHTML=opisKonfig(KONFIG);
      $("start").classList.remove("hidden");
    }else{
      $("konfig").classList.remove("hidden");
      konfigurator($("konfig"),()=>{$("konfig").classList.add("hidden");$("zaczynam").click();},"Zagraj");
    }
  }else{
    const s=zapisane();
    $("start").classList.remove("hidden");
    $("odznaka").textContent="Wyzwanie dnia #"+NR;
    if(s&&s.done){await laduj();Q=budujPytania(ZP.seeded("pz-dzien-"+DZIEN),s.res.length,null,s.res.length===6?["g","k","h","m","r","w"]:KOLEJ_DZIEN);return pokazWynik(s.res);}
  }
  if(RYWAL&&(TRYB==="turniej"||RYWAL.nr===NR)){
    $("odznaka").textContent="⚔️ Wyzwanie od: "+RYWAL.nick;
    $("startTytul").innerHTML=RYWAL.nick+" ma<br>"+fmt(RYWAL.wynik)+" pkt";
    $("startOpis").textContent=TRYB==="turniej"?"Te same 12 pytań, które dostał(a) "+RYWAL.nick+". Uda Ci się pobić ten wynik?":"Dzisiejsze wyzwanie. Uda Ci się pobić ten wynik?";
  }
  $("stanDanych").textContent="Wczytywanie map, herbów i zdjęć…";
  await laduj();
  $("stanDanych").textContent="";
  $("zaczynam").disabled=false;$("zaczynam").textContent="Zaczynam";
  $("startBtn").disabled=false;
}
$("startBtn").onclick=()=>{ // kreator turnieju
  $("setup").classList.add("hidden");$("start").classList.remove("hidden");
};
$("zaczynam").onclick=()=>{
  if(TRYB==="dzien"){
    Q=budujPytania(ZP.seeded("pz-dzien-"+DZIEN),8,null,KOLEJ_DZIEN);
    const s=zapisane();st={i:(s&&s.res?s.res.length:0)-1,res:(s&&s.res)||[]};
  }else{
    if(!ZIARNO||st){ZIARNO=Math.random().toString(36).slice(2,8);RYWAL=null;}
    Q=pytaniaZKonfig(KONFIG,ZP.seeded("turniej-"+ZIARNO));
    if(Q.length<3){ZP.komunikat("Za mało danych dla tego wyboru. Zaznacz większy obszar albo więcej wielkości miast.");return;}
    st={i:-1,res:[]};
  }
  $("start").classList.add("hidden");
  ustawPodp();
  $("segmenty").innerHTML=Q.map(()=>"<i></i>").join("");
  ["segmenty","gora","pytanie","stage"].forEach(id=>$(id).classList.remove("hidden"));
  nastepne();
};

/* ---------- rundy ---------- */
function schowaj(){if(window.Efekty)Efekty.przerwij();const pm=$("paraMapa");if(pm)pm.remove();["mapa","lot","tablica","para","ksztalt","rzekaMapa","foto","herbImg","miastoDuze","karty2","podpis","answers","wpis","okBtn","feedback","tbar"].forEach(id=>$(id).classList.add("hidden"));$("stage").classList.remove("jasna");$("answers").classList.remove("dwa");}
function segmenty(){[...$("segmenty").children].forEach((d,i)=>{const r=st.res[i];d.className=r?kolor(r.pts):(i===st.i?"teraz":"");});}
function nastepne(){
  st.i++;schowaj();
  if(st.i>=Q.length)return koniec();
  const q=Q[st.i];st.odp=false;st.podp=false;st.guess=null;
  $("runda").textContent=(st.i+1)+" / "+Q.length;
  $("chip").textContent=TYPY[q.t][0]+" "+TYPY[q.t][1];
  $("suma").textContent=fmt(st.res.reduce((a,r)=>a+r.pts,0));
  segmenty();
  const st2=$("stage");st2.style.animation="none";void st2.offsetWidth;st2.style.animation="";
  ({z:rundaZ,g:rundaG,k:rundaK,h:rundaH,m:rundaM,r:rundaR,w:rundaW,t:rundaT,c:rundaC,s:rundaS,v:rundaV})[q.t](q);
  const czas=TRYB==="dzien"?0:KONFIG.czas;
  if(czas>0)zegar(czas);
}
function wpisz(nazwy,poprawne,opcje){
  if(!POLE)POLE=ZP.poleWpisu($("wpis"),()=>st.nazwy,v=>odpWpis(v),{poprawne:()=>st.poprawne,pokazEtykieta:"Pokaż podpowiedzi<br><small>połowa punktów</small>",pokaz:()=>{st.podp=true;pokazOpcje();}});
  st.nazwy=nazwy;st.poprawne=poprawne;st.opcje=opcje;
  $("wpis").classList.remove("hidden");POLE.wyczysc();POLE.wylacz(false);POLE.focus();
}
function pokazOpcje(){
  const box=$("answers");box.innerHTML="";box.classList.remove("hidden");
  st.opcje.forEach(o=>{const b=document.createElement("button");b.textContent=o;b.onclick=()=>odpWpis(o,b);box.appendChild(b);});
}
function odpWpis(v,btn){
  if(st.odp)return;
  const ok=ZP.pasuje(v,st.poprawne);
  if(POLE)POLE.wylacz(true);
  [...$("answers").children].forEach(x=>{x.disabled=true;if(ZP.pasuje(x.textContent,st.poprawne))x.classList.add("right");else if(x===btn)x.classList.add("wrong");else x.classList.add("fade");});
  wynikRundy(ok?(st.podp?500:1000):0,ok,ok?"Dobrze":(v?"Niestety":"Pas"));
}
function rundaG(q){
  $("pytanie").textContent=q.c.n;
  $("mapa").classList.remove("hidden");
  if(!map){
    const PLB=L.latLngBounds([48.9,14.0],[55.0,24.3]);
    map=L.map("mapa",{zoomControl:true,attributionControl:true,minZoom:5,maxZoom:12,maxBounds:PLB.pad(0.4),zoomSnap:0.25});
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}",{maxZoom:16,attribution:"Esri"}).addTo(map);
    L.geoJSON({type:"FeatureCollection",features:D.woj.map(w=>w.f)},{style:{color:"#4F7F86",weight:1,fill:false},interactive:false}).addTo(map);
    warstwy=L.layerGroup().addTo(map);
    map.on("click",e=>{if(st.odp||Q[st.i].t!=="g")return;st.guess=e.latlng;warstwy.clearLayers();L.circleMarker(e.latlng,{radius:8,color:"#0A181B",weight:2,fillColor:"#E8F1EE",fillOpacity:1}).addTo(warstwy);$("okBtn").disabled=false;});
  }
  warstwy.clearLayers();
  setTimeout(()=>{map.invalidateSize();map.fitBounds([[49,14.1],[54.9,24.2]]);},30);
  $("okBtn").classList.remove("hidden");$("okBtn").disabled=true;
}
$("okBtn").onclick=()=>{
  if(st.odp||!st.guess)return;
  const q=Q[st.i],g={lat:st.guess.lat,lon:st.guess.lng},d=ZP.km(q.c,g);
  L.polyline([[g.lat,g.lon],[q.c.lat,q.c.lon]],{color:"#F2C14E",weight:2,dashArray:"6 5"}).addTo(warstwy);
  L.circleMarker([q.c.lat,q.c.lon],{radius:9,color:"#0A181B",weight:2,fillColor:"#F2C14E",fillOpacity:1}).addTo(warstwy).bindTooltip(q.c.n,{permanent:true,direction:"top",className:"cel-lbl"});
  map.flyToBounds(L.latLngBounds([[g.lat,g.lon],[q.c.lat,q.c.lon]]).pad(0.5),{duration:.8,maxZoom:9});
  $("okBtn").classList.add("hidden");
  wynikRundy(SCORE(d),d<=30,"Błąd "+(d<10?d.toFixed(1):Math.round(d))+" km");
};
function rundaZ(q){
  // Z lotu ptaka: zdjęcie satelitarne bez podpisów, można je przesuwać i przybliżać
  $("pytanie").textContent="Jakie to miasto?";
  $("lot").classList.remove("hidden");
  const z=q.c.pop>300000?13:q.c.pop>80000?14:15,sr=[q.c.lat+q.dy,q.c.lon+q.dx];
  if(!lotMap){
    lotMap=L.map("lot",{zoomControl:true,attributionControl:true,zoomSnap:0.5});
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:18,attribution:"Esri"}).addTo(lotMap);
  }
  if(lotZnacznik){lotMap.removeLayer(lotZnacznik);lotZnacznik=null;}
  lotMap.setMinZoom(z-2);lotMap.setMaxBounds(L.latLngBounds([sr[0]-.2,sr[1]-.3],[sr[0]+.2,sr[1]+.3]));
  setTimeout(()=>{lotMap.invalidateSize();lotMap.setView(sr,z,{animate:false});},30);
  wpisz(D.miasta.map(c=>c.n),[q.c.n],q.opcje);
}
function rundaT(q){
  $("pytanie").textContent="Skąd jest to auto?";
  $("tablicaKod").textContent=q.p.kod;
  $("tablica").classList.remove("hidden");
  const miasta=new Set(D.tab.filter(x=>x.typ==="miasto").map(x=>ZP.norm(x.nazwa)));
  const pop=[q.p.nazwa,q.p.nazwa.replace(/^powiat\s+/,"")];
  if(q.p.siedziba&&!miasta.has(ZP.norm(q.p.siedziba)))pop.push(q.p.siedziba);
  wpisz(D.tab.map(x=>x.nazwa),pop,q.opcje);
}
function rundaC(q){
  $("pytanie").textContent="Jaki klub gra w mieście";
  $("miastoDuze").textContent=q.c.n;$("miastoDuze").classList.remove("hidden");
  wpisz([...new Set(D.kluby.map(k=>k.klub))],q.kluby.flatMap(k=>[k.klub,k.pelna].concat(k.aliasy||[])),q.opcje);
}
function rundaS(q){
  $("pytanie").textContent="Czy te powiaty graniczą?";
  const box=$("para");box.innerHTML='<b></b><em>i</em><b></b><span></span>';
  const b=box.querySelectorAll("b");b[0].textContent=q.a.label||q.a.n;b[1].textContent=q.b.label||q.b.n;box.querySelector("span").textContent="woj. "+q.a.woj+(q.b.woj!==q.a.woj?" i "+q.b.woj:"");
  box.classList.remove("hidden");
  const a=$("answers");a.innerHTML="";a.classList.add("dwa");a.classList.remove("hidden");
  [["Graniczą",true],["Nie graniczą",false]].forEach(([t,v])=>{const x=document.createElement("button");x.textContent=t;x.onclick=()=>{
    if(st.odp)return;const ok=v===q.sas;
    [...a.children].forEach(y=>{y.disabled=true;y.classList.add(y===x?(ok?"right":"wrong"):(ok?"fade":"right"));});
    wynikRundy(ok?1000:0,ok,ok?"Dobrze":"Niestety");};a.appendChild(x);});
}
function rundaV(q){
  $("pytanie").textContent="W którym województwie leży";
  $("miastoDuze").textContent=q.c.n;$("miastoDuze").classList.remove("hidden");
  const a=$("answers");a.innerHTML="";a.classList.remove("hidden");
  q.opcje.forEach(o=>{const x=document.createElement("button");x.textContent=o;x.onclick=()=>{
    if(st.odp)return;const ok=o===q.woj;
    [...a.children].forEach(y=>{y.disabled=true;y.classList.add(y.textContent===q.woj?"right":y===x?"wrong":"fade");});
    wynikRundy(ok?1000:0,ok,ok?"Dobrze":"Niestety");};a.appendChild(x);});
}
function rundaK(q){
  $("pytanie").textContent="Który to powiat?";
  $("ksztalt").classList.remove("hidden");
  const nr=st.i;
  ZP.ksztaltZPodkladem($("ksztalt"),q.p.f,q.p.bb,400).then(()=>{
    if(st.i!==nr||st.odp)return;
    wpisz(D.pow.map(p=>p.short),[q.p.short,q.p.full,q.p.label],q.opcje);

function rundaH(q){
  $("pytanie").textContent="Czyj to herb?";
  $("stage").classList.add("jasna");
  $("herbImg").src=q.c.img;$("herbImg").classList.remove("hidden");Efekty.odwroc($("herbImg"));
  wpisz(D.herby.map(c=>c.n),[q.c.n],q.opcje);
}
function rundaM(q){
  $("pytanie").textContent="Co to za miasto?";

/* ---------- konfigurator rozgrywki: jakie gry, ile pytań, w jakiej kolejności ---------- */
const WSZYSTKIE=["z","g","m","k","h","t","r","c","w","s","v"];
const PRESETY={
  "Turniej":{gry:WSZYSTKIE.map(t=>({t,ile:2})),kolej:"przeplatane"},

};
function nowaKonfig(preset){

  const ord=p.gry.map(g=>g.t).concat(WSZYSTKIE.filter(t=>!p.gry.some(g=>g.t===t)));
  return {preset:preset||"Turniej",gry:ord.map(t=>({t,ile:(p.gry.find(g=>g.t===t)||{}).ile||0})),kolej:p.kolej,czas:p.czas!=null?p.czas:(MULTI?30:0),podp:p.podp!==false,premia:true,wielk:"dsm",obszar:[]};
}

function zKodu(s){
  try{const j=JSON.parse(decodeURIComponent(escape(atob(s))));
    const gry=j.g.split(".").map(x=>({t:x[0],ile:+x.slice(1)}));
    return {preset:"",gry:gry.concat(WSZYSTKIE.filter(t=>!gry.some(g=>g.t===t)).map(t=>({t,ile:0}))),kolej:{p:"po kolei",l:"losowo"}[j.k]||"przeplatane",czas:+j.c||0,podp:!!j.p,premia:!!j.b,wielk:j.w||"dsm",obszar:(j.o||"").split(",").filter(Boolean)};
  }catch(e){return null;}

function sekwencja(c,rnd){
  const gry=c.gry.filter(g=>g.ile>0);
  if(c.kolej==="po kolei")return gry.flatMap(g=>Array(g.ile).fill(g.t));
  if(c.kolej==="losowo")return losuj(rnd,gry.flatMap(g=>Array(g.ile).fill(g.t)));
  const zost=gry.map(g=>({t:g.t,n:g.ile})),out=[];
  while(zost.some(z=>z.n>0))zost.forEach(z=>{if(z.n>0){out.push(z.t);z.n--;}});
  return out;
}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
async function rzucWyzwanie(res,suma){
  let nick=localStorage.getItem("nick");
  if(!nick){nick=(prompt("Jak się podpisać w wyzwaniu?","")||"").trim().slice(0,20);if(!nick)return;localStorage.setItem("nick",nick);}
  const u=new URL(location.href.split("?")[0].split("#")[0]);
  if(TRYB==="turniej"){u.searchParams.set("tryb","turniej");u.searchParams.set("seed",ZIARNO);u.searchParams.set("k",kodKonfig(KONFIG));}
  else u.searchParams.set("nr",NR);
  u.searchParams.set("od",nick);u.searchParams.set("wynik",suma);
  const tekst="⚔️ "+nick+" rzuca Ci wyzwanie w PolskoZnawcy: "+fmt(suma)+" pkt"+(TRYB==="turniej"?" w turnieju. Te same 12 pytań, pobijesz?":" w wyzwaniu dnia #"+NR+". Pobijesz?")+"\n"+res.map(r=>({g:"🟩",y:"🟨",r:"🟥"})[kolor(r.pts)]).join("")+"\n"+u.toString();
  try{if(navigator.share){await navigator.share({text:tekst});return;}}catch(e){if(e&&e.name==="AbortError")return;}
  try{await navigator.clipboard.writeText(tekst);ZP.komunikat("Skopiowano link z wyzwaniem. Wklej go znajomemu.");}catch(e){ZP.komunikat(u.toString(),8000);}
}
async function udostepnij(res,suma,max,ranga){
  const tekst="PolskoZnawca "+(TRYB==="dzien"?"#"+NR:"Turniej")+"\n"+res.map(r=>({g:"🟩",y:"🟨",r:"🟥"})[kolor(r.pts)]).join("")+" "+fmt(suma)+"/"+fmt(max)+" · "+ranga+"\n"+location.href.split("?")[0]+(TRYB==="turniej"?"?tryb=turniej":"");
  try{
    const blob=await karta(res,suma,max,ranga);
    const plik=new File([blob],"polskoznawca-wynik.png",{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[plik]})){await navigator.share({files:[plik],text:tekst});return;}
    if(navigator.share){await navigator.share({text:tekst});return;}
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="polskoznawca-wynik.png";document.body.appendChild(a);a.click();a.remove();
    try{await navigator.clipboard.writeText(tekst);}catch(e){}
    ZP.komunikat("Zapisano obrazek z wynikiem i skopiowano tekst.");
  }catch(e){if(e&&e.name!=="AbortError"){try{await navigator.clipboard.writeText(tekst);ZP.komunikat("Skopiowano wynik do schowka.");}catch(x){}}}
}
