<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ranking — PolskoZnawca</title><link rel="stylesheet" href="wspolne.css?v=21"><style>main{max-width:640px;margin:auto;padding:24px}nav{display:flex;gap:12px;margin:20px 0}button,input{padding:12px;border-radius:12px;border:1px solid #71936c;font:inherit}button{background:#fff4cc;cursor:pointer}button[aria-pressed=true]{background:#c8e2be}table{width:100%;border-collapse:collapse;background:#fff8e7;border-radius:16px}th,td{text-align:left;padding:14px;border-bottom:1px solid #d8e2cc}label{display:block;margin:12px 0}p{line-height:1.5}#status{min-height:40px}a{color:#345d3b}</style><main><a href="gry.html">‹ Menu gier</a><h1>Ranking odkrywców</h1><p>10 punktów za poprawną odpowiedź. Kolekcja liczy pełne, unikalne karty.</p><nav><button id="points" aria-pressed="true">Punkty</button><button id="cards" aria-pressed="false">Karty</button></nav><p id="status" role="status" aria-live="polite"></p><table><thead><tr><th>Miejsce</th><th>Odkrywca</th><th id="value">Punkty</th></tr></thead><tbody id="rows"></tbody></table><form id="publish"><h2>Twój profil w rankingu</h2><label>Publiczny pseudonim <input id="nick" minlength="3" maxlength="24" required></label><label><input id="visible" type="checkbox"> Pokaż mój pseudonim i wynik publicznie</label><button>Zapisz aktualny wynik</button></form><p>Ranking rekreacyjny: wyniki pochodzą z urządzenia gracza. E-mail nie jest publikowany.</p><a href="logowanie.html">Logowanie / rejestracja</a></main><script src="karty.js?v=9"></script><script src="online-config.js"></script><script src="online.js"></script><script>
let mode='points';const status=document.getElementById('status'),rows=document.getElementById('rows');
async function load(){const requested=mode;document.getElementById('value').textContent=mode==='points'?'Punkty':'Karty';for(const x of ['points','cards'])document.getElementById(x).setAttribute('aria-pressed',String(x===mode));rows.replaceChildren();if(!Online.enabled()){status.textContent='Ranking online oczekuje na podłączenie kont. Twój lokalny wynik: '+Online.points()+' pkt.';return;}status.textContent='Wczytywanie…';try{const data=await Online.ranking(mode);if(requested!==mode)return;status.textContent=data.length?'':'Brak graczy w rankingu.';for(const r of data){const tr=document.createElement('tr');for(const val of [r.place,r.nickname,r.value]){const td=document.createElement('td');td.textContent=val;tr.append(td);}rows.append(tr);}}catch(e){status.textContent=e.message;}}
for(const x of ['points','cards'])document.getElementById(x).onclick=()=>{mode=x;load();};
document.getElementById('publish').onsubmit=async e=>{e.preventDefault();try{await Online.publish(document.getElementById('nick').value,document.getElementById('visible').checked);await load();status.textContent='Profil zapisany.';}catch(e){status.textContent=e.message;}};
load();
</script></html>
