<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Puzzle województwa · PolskoZnawca</title>
<meta name="theme-color" content="#FFF6E0" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="plansza.css?v=2" />
<style>
.tresc{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding:10px 12px 12px;position:relative}
.licznik{flex:none;display:flex;gap:8px}
.licznik span{flex:1;text-align:center;font-weight:900;font-size:12px;padding:5px;background:var(--krem);border:3px solid var(--braz);border-radius:12px}
.licznik b{display:block;font-family:Bungee,sans-serif;font-weight:400;font-size:19px}
.stol{flex:1;min-height:0;background:var(--krem);border:4px solid var(--braz);border-radius:18px;box-shadow:0 5px 0 var(--braz);overflow:hidden;position:relative}
#plansza{width:100%;height:100%;touch-action:none;display:block}
.cel path{fill:#EFE2BF;stroke:#C9B38A;stroke-width:1;vector-effect:non-scaling-stroke}
.cel .obrys{fill:none;stroke:var(--braz);stroke-width:2.5;vector-effect:non-scaling-stroke}
.cel.trudny path{stroke:none}
.tacka{fill:#E7D7AE;stroke:none}
.kawalek{cursor:grab;transition:transform .18s ease-out}
.kawalek.ciagnij{transition:none;cursor:grabbing}
.kawalek path{fill:var(--zolt);stroke:var(--braz);stroke-width:1.6;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.kawalek.ciagnij path{fill:#FFD15C;filter:drop-shadow(0 6px 4px rgba(58,42,20,.35))}
.kawalek.na-miejscu{pointer-events:none}
.kawalek.na-miejscu path{fill:#7FCB6A;animation:wskocz .5s}
@keyframes wskocz{50%{fill:#C8F2B8}}
.miasto path{fill:#3F7A55;stroke:var(--braz);stroke-width:1;vector-effect:non-scaling-stroke}
.podpis{font:700 9px Rubik,sans-serif;fill:var(--braz);text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:#FFF6E0;stroke-width:3px}
.wybor{position:absolute;inset:0;z-index:20;background:rgba(40,28,10,.5);display:grid;place-items:center;padding:12px}
.wybor .pole{width:100%;max-width:420px;padding:16px;display:flex;flex-direction:column;gap:10px;max-height:100%;overflow:auto}
.wybor h2{font-family:Bungee,sans-serif;font-weight:400;font-size:24px;margin:0}
.woje{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.woje button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border:3px solid var(--braz);border-radius:12px;background:#fff;font-size:9.5px;font-weight:700;line-height:1.1}
.woje button svg{width:80%;height:38px}.woje button svg path{fill:var(--zolt);stroke:var(--braz);stroke-width:1.2;vector-effect:non-scaling-stroke}
.woje button.akt{background:var(--zolt)}
.tryb{display:flex;gap:6px}.tryb button{flex:1;border:3px solid var(--braz);border-radius:12px;background:#fff;padding:8px;font-weight:900;font-size:13px}
.tryb button.akt{background:var(--zolt)}
.koniec h2{font-family:Bungee,sans-serif;font-weight:400;font-size:26px;margin:0;text-align:center}
.gw{font-size:48px;letter-spacing:4px;color:#C9BFA0;text-align:center}.gw .z{color:#FFC93C;text-shadow:0 3px 0 var(--braz)}
</style>
</head>
<body>
<div class="wrap">
  <header class="gora"><a href="gry.html" class="klocek jasny" style="min-height:40px;padding:0 12px" aria-label="Wróć">‹</a><h1>Puzzle<small id="podt">ułóż powiaty w województwie</small></h1><button class="zeton" id="zmien">Zmień</button></header>
  <main class="tresc">
    <div class="licznik"><span>Ułożone<b id="ulozone">0/0</b></span><span>Czas<b id="czas">0:00</b></span><span>Rekord<b id="rek">–</b></span></div>
    <div class="stol"><svg id="plansza" preserveAspectRatio="xMidYMid meet"></svg></div>
  </main>
  <div id="warstwa"></div>
</div>
<script src="efekty.js?v=17"></script>
<script src="topojson-client.min.js?v=17"></script>
<script src="wspolne.js?v=17"></script>
<script>
const {$,shuffle}=ZP;
let WOJ=[],POW=[],wyb=localStorage.getItem("puzzle-woj")||"",tryb=localStorage.getItem("puzzle-tryb")||"latwy",gra=null,zegar=null;
const W=360;
const fmtCz=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
function wybor(){
  const w=$("warstwa");
  w.innerHTML='<div class="wybor"><div class="pole"><h2>Które województwo?</h2><div class="woje">'
    +WOJ.slice().sort((a,b)=>a.name.localeCompare(b.name,"pl")).map(x=>{const P=ZP.projection([x.f],60,3);const n=POW.filter(p=>p.woj===x.name&&!p.city).length;
      return '<button data-w="'+x.name+'" class="'+(x.name===wyb?"akt":"")+'"><svg viewBox="0 0 60 '+P.H.toFixed(0)+'"><path d="'+P.path(x.f.geometry,0.8)+'"/></svg>'+x.name+'<span>'+n+' el.</span></button>';}).join("")
    +'</div><div class="tryb"><button data-t="latwy" class="'+(tryb==="latwy"?"akt":"")+'">Łatwy: widać granice</button><button data-t="trudny" class="'+(tryb==="trudny"?"akt":"")+'">Trudny: sam kontur</button></div></div></div>';
  w.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tryb=b.dataset.t;localStorage.setItem("puzzle-tryb",tryb);w.querySelectorAll("[data-t]").forEach(x=>x.classList.toggle("akt",x===b));});
  w.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{wyb=b.dataset.w;localStorage.setItem("puzzle-woj",wyb);w.innerHTML="";nowa();});
}
function nowa(){
  clearInterval(zegar);$("warstwa").innerHTML="";
  const zest=POW.filter(p=>p.woj===wyb),kaw=zest.filter(p=>!p.city),miasta=zest.filter(p=>p.city);
  const P=ZP.projection(zest.map(p=>p.f),W,8),H=P.H,TACKA=Math.max(150,H*.62),svg=$("plansza");
  svg.setAttribute("viewBox","0 0 "+W+" "+(H+TACKA));
  $("podt").textContent="woj. "+wyb+" · "+(tryb==="latwy"?"łatwy":"trudny");
  const kontur=WOJ.find(x=>x.name===wyb);
  let h='<g class="cel'+(tryb==="trudny"?" trudny":"")+'">'+zest.map(p=>'<path d="'+P.path(p.f.geometry,0.5)+'"/>').join("")+'<path class="obrys" d="'+P.path(kontur.f.geometry,0.5)+'"/></g>';
  h+='<rect class="tacka" x="0" y="'+(H+4)+'" width="'+W+'" height="'+(TACKA-4)+'" rx="10"/>';
  // miasta na prawach powiatu są małe: leżą od razu na swoich miejscach
  h+=miasta.map(p=>'<g class="miasto"><path d="'+P.path(p.f.geometry,0.4)+'"/></g>').join("");
  h+='<g id="kaw"></g><g id="podpisy"></g>';
  svg.innerHTML=h;
  // kawałki w tacce, zmniejszone; po podniesieniu wracają do pełnego rozmiaru
  const kol=Math.ceil(Math.sqrt(kaw.length*W/TACKA)),wier=Math.ceil(kaw.length/kol),sw=W/kol,sh=(TACKA-10)/wier;
  const g=$("kaw");
  gra={P,H,elementy:[],ulozone:0,n:kaw.length,start:0,ruchy:0};
  shuffle(kaw).forEach((p,i)=>{
    const d=P.path(p.f.geometry,0.5);let bx=[1e9,1e9,-1e9,-1e9];
    const polys=p.f.geometry.type==="Polygon"?[p.f.geometry.coordinates]:p.f.geometry.coordinates;
    polys.forEach(pl=>pl[0].forEach(([x,y])=>{const X=P.x(x),Y=P.y(y);bx[0]=Math.min(bx[0],X);bx[1]=Math.min(bx[1],Y);bx[2]=Math.max(bx[2],X);bx[3]=Math.max(bx[3],Y);}));
    const cx=(bx[0]+bx[2])/2,cy=(bx[1]+bx[3])/2,s=Math.min(.6,(sw*.85)/(bx[2]-bx[0]),(sh*.85)/(bx[3]-bx[1]));
    const sx=(i%kol+.5)*sw,sy=H+8+(Math.floor(i/kol)+.5)*sh;
    const e=document.createElementNS("http://www.w3.org/2000/svg","g");e.setAttribute("class","kawalek");e.innerHTML='<path d="'+d+'"/>';
    const st={e,p,cx,cy,tx:sx-cx,ty:sy-cy,s,s0:s,tx0:sx-cx,ty0:sy-cy,miejsce:false};
    ustaw(st);g.appendChild(e);gra.elementy.push(st);ciagnij(st);
  });
  $("ulozone").textContent="0/"+kaw.length;$("czas").textContent="0:00";
  const r=localStorage.getItem("puzzle-"+wyb+"-"+tryb);$("rek").textContent=r?fmtCz(+r):"–";
}
function ustaw(st){st.e.setAttribute("transform","translate("+st.tx.toFixed(1)+" "+st.ty.toFixed(1)+") translate("+st.cx.toFixed(1)+" "+st.cy.toFixed(1)+") scale("+st.s+") translate("+(-st.cx).toFixed(1)+" "+(-st.cy).toFixed(1)+")");}
function punkt(e){const svg=$("plansza"),p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());}
function ciagnij(st){
  let start=null;
  st.e.addEventListener("pointerdown",e=>{
    if(st.miejsce)return;e.preventDefault();st.e.setPointerCapture(e.pointerId);
    if(!gra.start){gra.start=Date.now();zegar=setInterval(()=>{$("czas").textContent=fmtCz(Math.floor((Date.now()-gra.start)/1000));},500);}
    const p=punkt(e);
    // podniesiony kawałek rośnie do pełnego rozmiaru pod palcem
    const wx=st.tx+st.cx,wy=st.ty+st.cy;st.s=1;st.tx=p.x-st.cx-(p.x-wx)*1;st.ty=p.y-st.cy-(p.y-wy)*1-30;
    start={x:p.x,y:p.y,tx:st.tx,ty:st.ty};
    st.e.classList.add("ciagnij");st.e.parentNode.appendChild(st.e);ustaw(st);
  });
  st.e.addEventListener("pointermove",e=>{if(!start)return;const p=punkt(e);st.tx=start.tx+p.x-start.x;st.ty=start.ty+p.y-start.y;ustaw(st);});
  const pusc=()=>{
    if(!start)return;start=null;st.e.classList.remove("ciagnij");gra.ruchy++;
    const tol=tryb==="latwy"?20:12;
    if(Math.hypot(st.tx,st.ty)<tol){
      st.tx=0;st.ty=0;st.miejsce=true;st.e.classList.add("na-miejscu");ustaw(st);gra.ulozone++;
      $("ulozone").textContent=gra.ulozone+"/"+gra.n;
      $("podpisy").insertAdjacentHTML("beforeend",'<text class="podpis" x="'+st.cx.toFixed(1)+'" y="'+st.cy.toFixed(1)+'">'+(st.p.short||st.p.n)+'</text>');
      const r=st.e.getBoundingClientRect();if(window.Efekty)Efekty.fala(r.left+r.width/2,r.top+r.height/2,"#27AE60");
      if(navigator.vibrate)try{navigator.vibrate(20);}catch(x){}
      if(gra.ulozone===gra.n)setTimeout(koniec,500);
    }else if(st.ty+st.cy<gra.H*0.02||st.ty+st.cy>gra.H){
      // upuszczony daleko od planszy: wraca do tacki
      st.s=st.s0;st.tx=st.tx0;st.ty=st.ty0;ustaw(st);
    }
  };
  st.e.addEventListener("pointerup",pusc);st.e.addEventListener("pointercancel",pusc);
}
function koniec(){
  clearInterval(zegar);
  const sek=Math.round((Date.now()-gra.start)/1000),naK=sek/gra.n,gw=naK<=6?3:naK<=12?2:1;
  const k="puzzle-"+wyb+"-"+tryb,r=+(localStorage.getItem(k)||0),nowy=!r||sek<r;if(nowy)localStorage.setItem(k,sek);
  // miasta na prawach powiatu też dostają podpisy
  POW.filter(p=>p.woj===wyb&&p.city).forEach(p=>{$("podpisy").insertAdjacentHTML("beforeend",'<text class="podpis" x="'+gra.P.x(p.lon).toFixed(1)+'" y="'+gra.P.y(p.lat).toFixed(1)+'" style="fill:#fff;stroke:#3F7A55">'+(p.short||p.n)+'</text>');});
  $("warstwa").innerHTML='<div class="wybor"><div class="pole koniec"><h2>Ułożone!</h2><div class="gw">'+[1,2,3].map(i=>'<span class="'+(i<=gw?"z":"")+'">★</span>').join("")+'</div>'
    +'<b style="text-align:center">'+fmtCz(sek)+' · '+gra.n+' powiatów</b><span style="text-align:center;font-weight:700">'+(nowy?"Nowy rekord!":"Rekord: "+fmtCz(r))+'</span>'
    +'<button class="klocek" id="znowu">Jeszcze raz</button><button class="klocek jasny" id="inne">Inne województwo</button></div></div>';
  $("znowu").onclick=nowa;$("inne").onclick=wybor;
  if(gw===3)setTimeout(ZP.fanfary,200);
}
$("zmien").onclick=wybor;
Promise.all([ZP.loadWoj(),ZP.loadPowiaty()]).then(([w,p])=>{WOJ=w;POW=p;if(wyb&&WOJ.some(x=>x.name===wyb))nowa();else wybor();});
ZP.fitViewport();ZP.registerSW();
</script>
</body>
</html>
