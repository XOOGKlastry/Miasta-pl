<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>PolskoZnawca · Plansza</title>
<meta name="theme-color" content="#FFF6E0" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-192.png" />

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
.mapa{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.mapa::-webkit-scrollbar{display:none}
.plotno{position:relative;width:100%}
.pas{position:absolute;left:0;right:0}
.instaluj{flex:none;display:flex;align-items:center;gap:10px;padding:8px 10px;background:#FFE7A3;border-bottom:4px solid var(--braz);position:relative;z-index:5}
.instaluj span{flex:1;min-width:0}.instaluj b{display:block;font-size:14px}.instaluj small{display:block;font-size:11px;font-weight:700;color:var(--braz-2)}
.instaluj .klocek{min-height:40px;padding:0 12px;font-size:13px}
.instaluj .zamknij{background:none;border:none;font-size:18px;padding:4px 6px;color:var(--braz)}
.mgla{position:absolute;left:0;right:0;pointer-events:none;z-index:4;overflow:hidden}
.falsz{position:fixed;z-index:940;width:58px;height:58px;border-radius:50%;border:4px solid #8A7F62;background:#C9C0A0;display:grid;place-items:center;transform:translate(-50%,-50%);pointer-events:none}
.pas::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(58,42,20,.08) 1.5px,transparent 1.5px);background-size:16px 16px}
.sciezka{position:absolute;left:0;top:0;pointer-events:none}
.baner{position:absolute;left:12px;right:12px;display:flex;align-items:center;gap:10px;padding:8px 12px;z-index:2}
.baner svg.woj{width:54px;height:46px;flex:none}
.baner svg.woj path{fill:var(--zolt);stroke:var(--braz);stroke-width:1.6;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.baner b{display:block;font-family:Bungee,sans-serif;font-weight:400;font-size:16px;line-height:1.05}
.baner small{font-size:12px;font-weight:700;color:var(--braz-2)}
.baner .gw{margin-left:auto;font-weight:900;font-size:14px;white-space:nowrap}
.baner.zamk{filter:grayscale(.7);opacity:.85}
.wezel{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;z-index:3;background:none;border:none;padding:0}
.wezel .kolo{width:58px;height:58px;border-radius:50%;border:4px solid var(--braz);display:grid;place-items:center;font-family:Bungee,sans-serif;font-size:19px;
  box-shadow:0 5px 0 var(--braz);transition:transform .1s,box-shadow .1s;background:var(--zolt)}
.wezel:active .kolo{transform:translateY(4px);box-shadow:0 1px 0 var(--braz)}
.wezel.zrobiony .kolo{background:var(--zolt)}
.wezel.teraz .kolo{background:var(--czer);color:#fff;animation:puls 1.6s ease-in-out infinite}
.wezel.zamkniety .kolo{background:#C9C0A0;color:#8A7F62;box-shadow:0 5px 0 #8A7F62;border-color:#8A7F62}
.wezel.boss .kolo{width:74px;height:74px;font-size:15px}
.wezel .gwiazdki{margin-top:5px;display:flex;gap:1px;font-size:15px;line-height:1;color:#6E6446;text-shadow:0 1px 0 var(--krem)}
.wezel .gwiazdki .z{color:#FFC93C;text-shadow:0 2px 0 var(--braz)}
@keyframes puls{0%,100%{box-shadow:0 5px 0 var(--braz),0 0 0 0 rgba(232,74,60,.6)}50%{box-shadow:0 5px 0 var(--braz),0 0 0 12px rgba(232,74,60,0)}}
.pionek{position:absolute;z-index:4;width:34px;height:46px;transform:translate(-50%,-100%);pointer-events:none;transition:left .9s cubic-bezier(.4,1.4,.6,1),top .9s cubic-bezier(.4,1.4,.6,1)}
.pionek svg{width:100%;height:100%;animation:skok 1.2s ease-in-out infinite}
@keyframes skok{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.kostka-btn{position:absolute;right:14px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:6;width:66px;height:66px;border-radius:18px;background:var(--krem);border:4px solid var(--braz);box-shadow:0 6px 0 var(--braz);display:grid;place-items:center;padding:0}
.kostka-btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--braz)}
.kostka-btn span{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-family:Bungee,sans-serif;font-size:11px;color:var(--krem);white-space:nowrap;text-shadow:0 2px 0 var(--braz)}
.dzis-btn{position:absolute;left:14px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:16px;background:var(--krem);border:4px solid var(--braz);box-shadow:0 6px 0 var(--braz);font-weight:900;font-size:13px;max-width:62%}
.dzis-btn i{width:10px;height:10px;border-radius:50%;background:var(--czer);flex:none;animation:puls-k 1.2s infinite}
@keyframes puls-k{50%{transform:scale(1.4)}}
/* arkusz poziomu */
.cien{position:absolute;inset:0;z-index:20;background:rgba(40,28,10,.55);animation:pojaw .2s both}
@keyframes pojaw{from{opacity:0}}
.arkusz{position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:21;padding:16px;animation:wjedz .3s cubic-bezier(.2,1.3,.4,1) both}
@keyframes wjedz{from{transform:translateY(40px);opacity:0}}
.arkusz h2{font-family:Bungee,sans-serif;font-weight:400;font-size:26px;margin:0}
.arkusz p{margin:4px 0 10px;font-weight:700;color:var(--braz-2)}
.arkusz .gry{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.arkusz .gry span{background:#fff;border:3px solid var(--braz);border-radius:10px;padding:4px 9px;font-size:12.5px;font-weight:700}
.arkusz .rek{font-size:26px;color:#6E6446;letter-spacing:2px}.arkusz .rek .z{color:#FFC93C;text-shadow:0 2px 0 var(--braz)}
.arkusz .rzad{display:flex;gap:10px;align-items:center}
.arkusz .klocek{flex:1}
/* kostka */
.rzut{position:absolute;inset:0;z-index:21;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:20px}
.scena{width:130px;height:130px;perspective:600px}
.kostka{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform 1.6s cubic-bezier(.2,.9,.25,1)}
.sciana{position:absolute;inset:0;background:var(--krem);border:5px solid var(--braz);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:Bungee,sans-serif;font-size:13px}
.sciana svg{width:46px;height:46px}
.rzut .wynik{font-family:Bungee,sans-serif;font-size:28px;color:var(--krem);text-shadow:0 3px 0 var(--braz);text-align:center;min-height:36px}
</style>
</head>
<body>
<div class="wrap">
  <header class="gora">
    <img src="icon.svg?v=14" alt="" width="36" height="36" style="border-radius:10px;border:3px solid var(--braz)">
    <h1>PolskoZnawca<small id="kraina">Plansza przygód</small></h1>
    <span class="zeton"><span class="gw">★</span><span id="sumaGw">0</span></span>
    <span class="zeton" title="Seria dni"><svg width="16" height="16" viewBox="0 0 24 24" fill="#E84A3C" stroke="#3A2A14" stroke-width="2"><path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-3 2-4 2-7 2 1 3 3 3 5 1-2 0-5 0-8z"/></svg><span id="seria">0</span></span>
  </header>
  <div class="instaluj hidden" id="instaluj"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#3A2A14" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M12 7v7M9 11l3 3 3-3"/></svg><span><b>Zainstaluj grę</b><small>ikona na ekranie, pełny ekran, działa bez internetu</small></span><button class="klocek" id="instBtn">Zainstaluj</button><button class="zamknij" id="instX" aria-label="Zamknij">✕</button></div>
  <div class="mapa" id="mapa"><div class="plotno" id="plotno"></div></div>
  <div class="mgla" id="mgla"></div>
  <a class="dzis-btn" href="codzienne.html" id="dzisBtn"><i></i><span id="dzisTxt">Wyzwanie dnia czeka</span></a>
  <button class="kostka-btn" id="kostkaBtn" aria-label="Rzuć kostką"><svg width="40" height="40" viewBox="0 0 40 40"><rect x="3" y="3" width="34" height="34" rx="8" fill="#E84A3C" stroke="#3A2A14" stroke-width="3"/><circle cx="12" cy="12" r="3.3" fill="#fff"/><circle cx="28" cy="12" r="3.3" fill="#fff"/><circle cx="20" cy="20" r="3.3" fill="#fff"/><circle cx="12" cy="28" r="3.3" fill="#fff"/><circle cx="28" cy="28" r="3.3" fill="#fff"/></svg><span>Rzuć kostką</span></button>
  <div id="warstwa"></div>
  <nav class="dol">
  <a href="./" class="akt" data-n="plansza"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 20c0-4 3-4 3-8s-3-4-3-8"/><circle cx="16" cy="6" r="2.5"/><circle cx="16" cy="18" r="2.5"/><path d="M16 8.5v7"/></svg>Plansza</a>
  <a href="codzienne.html" data-n="codzienne"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Codzienne</a>
  <a href="wyzwanie.html?tryb=pojedynek" data-n="znajomi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.5 3-6 6-6s6 2.5 6 6M15 20c0-2.5 1.5-4.5 4-4.5"/></svg>Znajomi</a>
  <a href="gry.html" data-n="gry"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>Gry</a>
  <a href="profil.html" data-n="profil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>Profil</a>

<script>
const $=id=>document.getElementById(id);
const TYPY={z:"Z lotu ptaka",g:"Gdzie to jest?",m:"Co to za miasto?",k:"Kształt powiatu",h:"Herb",t:"Tablice",r:"Rzeka",c:"Kluby",w:"Więcej czy mniej",s:"Graniczą?",v:"Województwo"};
const IKK={mapa:'<path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/>',zdjecia:'<rect x="3" y="7" width="18" height="13" rx="2"/><circle cx="12" cy="13.5" r="3.5"/><path d="M8 7l1.5-3h5L16 7"/>',
  symbole:'<path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/>',granice:'<path d="M5 4l9 2 5 6-3 8-9-1-3-7z"/>',liczby:'<path d="M12 3v18M5 21h14M4 8h16M7 8l-3 7h6zM17 8l-3 7h6z"/>',woda:'<path d="M3 8c3-3 6 3 9 0s6 3 9 0M3 15c3-3 6 3 9 0s6 3 9 0"/>'};
const czytaj=(k,d)=>{try{return JSON.parse(localStorage.getItem(k)||"null")||d;}catch(e){return d;}};
const STEP=96,BANER=110,GORA=140,DOL=150;
let WOJ={},stan=Saga.stan(),biez=Saga.biezacy(stan),PASY=[],MGLA=null;

function wspolrzedne(W){
  // od dołu: poziom 0 na dole, każda kraina zaczyna się banerem
  const pts=[],H=GORA+DOL+Saga.ILE*STEP+Saga.SWIATY.length*BANER;
  for(let n=0;n<Saga.ILE;n++){
    const s=Math.floor(n/Saga.NA_SWIAT);
    const y=H-DOL-n*STEP-(s+1)*BANER-STEP/2;
    const x=W/2+Math.sin(n*0.95)*Math.min(120,W*0.3);
    pts.push({x,y});
  }
  return {pts,H};
}
function gwiazdkiHtml(g){return [1,2,3].map(i=>'<span class="'+(i<=g?"z":"")+'">★</span>').join("");}
function rysuj(){
  const W=$("mapa").clientWidth,{pts,H}=wspolrzedne(W),pl=$("plotno");
  pl.style.height=H+"px";
  let h="";
  // pasy krain
  PASY=[];
  Saga.SWIATY.forEach((sw,s)=>{
    const dol=H-DOL-s*(Saga.NA_SWIAT*STEP+BANER)+ (s===0?DOL:0),gora=H-DOL-(s+1)*(Saga.NA_SWIAT*STEP+BANER);
    PASY.push({s,top:gora,bottom:dol-(s===0?DOL:0)-BANER*0.2});
    h+='<div class="pas" style="top:'+gora+'px;height:'+(dol-gora)+'px;background:'+sw.kolor+'"></div>';
  });
  // ścieżka
  let d="M"+pts[0].x.toFixed(0)+" "+(pts[0].y+60).toFixed(0);
  pts.forEach((p,i)=>{if(i===0){d+=" L"+p.x.toFixed(0)+" "+p.y.toFixed(0);return;}const a=pts[i-1];d+=" C"+a.x.toFixed(0)+" "+((a.y+p.y)/2).toFixed(0)+" "+p.x.toFixed(0)+" "+((a.y+p.y)/2).toFixed(0)+" "+p.x.toFixed(0)+" "+p.y.toFixed(0);});
  h+='<svg class="sciezka" width="'+W+'" height="'+H+'"><path d="'+d+'" fill="none" stroke="#3A2A14" stroke-width="34" stroke-linecap="round" opacity=".25"/><path d="'+d+'" fill="none" stroke="#F3E6C4" stroke-width="26" stroke-linecap="round"/><path d="'+d+'" fill="none" stroke="#B89A5E" stroke-width="3" stroke-dasharray="10 10"/></svg>';
  // banery krain
  Saga.SWIATY.forEach((sw,s)=>{
    const y=H-DOL-s*(Saga.NA_SWIAT*STEP+BANER)-BANER+18;
    const gw=[...Array(Saga.NA_SWIAT)].reduce((a,_,i)=>a+(stan.gw[s*Saga.NA_SWIAT+i]||0),0);
    const otw=Saga.odblokowany(s*Saga.NA_SWIAT,stan);
    h+='<div class="baner pole'+(otw?"":" zamk")+'" style="top:'+y+'px">'+(WOJ[sw.woj]||'<svg class="woj"></svg>')+'<div><b>'+sw.nazwa+'</b><small>Kraina '+(s+1)+' · stolica: '+sw.stolica+'</small></div><span class="gw">★ '+gw+'/'+(Saga.NA_SWIAT*3)+'</span></div>';
  });
  // węzły
  pts.forEach((p,n)=>{
    const poz=Saga.poziom(n),g=stan.gw[n]||0,otw=Saga.odblokowany(n,stan);
    const kl=(n===biez?"teraz":otw?"zrobiony":"zamkniety")+(poz.boss?" boss":"");
    const tresc=!otw?'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8A7F62" stroke-width="2.6"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>'
      :poz.boss?'<svg width="34" height="30" viewBox="0 0 34 30"><path d="M3 26 L3 8 L10 15 L17 3 L24 15 L31 8 L31 26 Z" fill="'+(n===biez?"#fff":"#E84A3C")+'" stroke="#3A2A14" stroke-width="2.5" stroke-linejoin="round"/></svg>':String(n+1);
    h+='<button class="wezel '+kl+'" data-n="'+n+'" style="left:'+p.x.toFixed(0)+'px;top:'+p.y.toFixed(0)+'px"><span class="kolo">'+tresc+'</span>'+(otw&&n!==biez||g?'<span class="gwiazdki">'+gwiazdkiHtml(g)+'</span>':'')+'</button>';
  });
  h+='<div class="pionek" id="pionek"><svg viewBox="0 0 34 46"><ellipse cx="17" cy="43" rx="12" ry="3" fill="#3A2A14" opacity=".35"/><path d="M8 40 Q8 30 13 26 Q9 22 9 16 A8 8 0 0 1 25 16 Q25 22 21 26 Q26 30 26 40 Z" fill="#2E86DE" stroke="#3A2A14" stroke-width="3" stroke-linejoin="round"/><circle cx="14" cy="14" r="2.5" fill="#fff" opacity=".7"/></svg></div>';
  pl.innerHTML=h;
  pl.querySelectorAll(".wezel").forEach(b=>b.onclick=e=>{if(window.Efekty)Efekty.fala(e.clientX,e.clientY);setTimeout(()=>arkusz(+b.dataset.n),120);});
  return pts;
}
function pionekNa(p,natychmiast){const pn=$("pionek");if(natychmiast)pn.style.transition="none";pn.style.left=p.x+"px";pn.style.top=(p.y-34)+"px";if(natychmiast){void pn.offsetWidth;pn.style.transition="";}}
function arkusz(n){
  const poz=Saga.poziom(n),otw=Saga.odblokowany(n,stan),g=stan.gw[n]||0;
  const w=$("warstwa");
  w.innerHTML='<div class="cien" id="cien"></div><div class="arkusz pole"><h2>'+(poz.boss?"Stolica: "+poz.kraina.stolica:"Poziom "+(n+1))+'</h2>'
    +'<p>'+poz.kraina.nazwa+' · '+(poz.boss?"poziom mistrzowski":poz.nazwa)+' · '+poz.pytan+' pytań</p>'
    +'<div class="gry">'+poz.gry.map(x=>'<span>'+TYPY[x.t]+(x.ile>1?" ×"+x.ile:"")+'</span>').join("")+'</div>'
    +'<div class="rzad"><span class="rek">'+gwiazdkiHtml(g)+'</span>'+(otw?'<a class="klocek" href="wyzwanie.html?tryb=saga&poziom='+n+'">Graj</a>':'<span style="font-weight:700;font-size:14px">Zdobądź '+(Saga.poziom(n-1).boss?"2 gwiazdki":"gwiazdkę")+' na poziomie '+n+', żeby tu wejść.</span>')+'</div></div>';
  $("cien").onclick=()=>{w.innerHTML="";};
}
function kostka(){
  const K=Saga.KOSTKA,w=$("warstwa");
  const obr=["rotateY(0deg)","rotateY(-90deg)","rotateY(-180deg)","rotateY(90deg)","rotateX(-90deg)","rotateX(90deg)"];
  const poz=["translateZ(65px)","rotateY(90deg) translateZ(65px)","rotateY(180deg) translateZ(65px)","rotateY(-90deg) translateZ(65px)","rotateX(90deg) translateZ(65px)","rotateX(-90deg) translateZ(65px)"];
  w.innerHTML='<div class="cien" id="cien"></div><div class="rzut"><div class="scena"><div class="kostka" id="kost">'
    +K.map((k,i)=>'<div class="sciana" style="transform:'+poz[i]+'"><svg viewBox="0 0 24 24" fill="none" stroke="#3A2A14" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">'+IKK[k.id]+'</svg>'+k.nazwa+'</div>').join("")
    +'</div></div><div class="wynik" id="kWynik">Rzucam…</div><a class="klocek" id="kGraj" style="visibility:hidden">Graj</a><button class="klocek jasny" id="kZnowu" style="visibility:hidden">Rzuć jeszcze raz</button></div>';
  $("cien").onclick=()=>{w.innerHTML="";};
  const rzuc=()=>{
    const i=Math.floor(Math.random()*6),k=$("kost");
    $("kGraj").style.visibility="hidden";$("kZnowu").style.visibility="hidden";$("kWynik").textContent="Rzucam…";
    const spin=" rotateX("+(720+Math.floor(Math.random()*2)*360)+"deg) rotateY("+(720+Math.floor(Math.random()*2)*360)+"deg)";
    k.style.transition="none";k.style.transform="rotateX(0) rotateY(0)";void k.offsetWidth;k.style.transition="";
    k.style.transform=spin+" "+obr[i];
    if(navigator.vibrate)try{navigator.vibrate([20,40,20,40,30]);}catch(e){}
    setTimeout(()=>{$("kWynik").textContent=K[i].nazwa+"!";const g=$("kGraj");g.href="wyzwanie.html?tryb=kostka&kat="+K[i].id;g.textContent="Graj: "+K[i].nazwa;g.style.visibility="visible";$("kZnowu").style.visibility="visible";},1650);
  };
  $("kZnowu").onclick=rzuc;setTimeout(rzuc,60);
}
$("kostkaBtn").onclick=kostka;
// zaproszenie do instalacji: pokazujemy, dopóki gra nie jest zainstalowana i gracz go nie zamknął
function pokazInstaluj(){const ukryte=localStorage.getItem("instaluj-ukryj")==="1";$("instaluj").classList.toggle("hidden",ukryte||!Instaluj.mozna());}
Instaluj.naZmiane(pokazInstaluj);setTimeout(pokazInstaluj,1200);
$("instBtn").onclick=()=>Instaluj.zainstaluj();

let NOWA_KRAINA=-1;
function start(){
  let nowy=-1;try{nowy=+(sessionStorage.getItem("saga-nowy")||-1);sessionStorage.removeItem("saga-nowy");}catch(e){}
  if(nowy>0&&nowy%Saga.NA_SWIAT===0)NOWA_KRAINA=nowy/Saga.NA_SWIAT;
  const pts=rysuj();
  const mg=$("mgla"),m0=$("mapa");mg.style.top=m0.offsetTop+"px";mg.style.height=m0.clientHeight+"px";
  if(window.Efekty){if(MGLA)MGLA.stop();MGLA=Efekty.chmury(mg,m0,zamkniete);}
  if(nowy>0&&window.Efekty)setTimeout(()=>{
    // świeżo odblokowane pole: kłódka pęka na odłamki
    const w=document.querySelector('.wezel[data-n="'+nowy+'"] .kolo');if(!w)return;
    const r=w.getBoundingClientRect(),f=document.createElement("span");f.className="falsz";
    f.style.left=(r.left+r.width/2)+"px";f.style.top=(r.top+r.height/2)+"px";
    f.innerHTML='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8A7F62" stroke-width="2.6"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
    document.body.appendChild(f);
    setTimeout(()=>{Efekty.rozbij(f,["#C9C0A0","#B3AA88","#8A7F62","#E8DFC2"],()=>f.remove());Efekty.fala(r.left+r.width/2,r.top+r.height/2,"#F5B82E");
      if(NOWA_KRAINA>=0&&MGLA){const p=PASY.find(x=>x.s===NOWA_KRAINA);if(p)MGLA.rozwiej(p.top,p.bottom);NOWA_KRAINA=-1;}},700);
  },1500);
  const h=location.hash.match(/poziom=(\d+)/),cel=h?Math.min(+h[1],biez):biez;
  const m=$("mapa"),naSrodek=p=>{m.scrollTop=p.y-m.clientHeight*0.55;};
  // po przejściu poziomu pionek przeskakuje z poprzedniego pola na nowe
  if(h&&cel>0&&cel===biez){naSrodek(pts[cel-1]);pionekNa(pts[cel-1],true);setTimeout(()=>{pionekNa(pts[cel]);m.scrollTo({top:pts[cel].y-m.clientHeight*0.55,behavior:"smooth"});},450);}

}
fetch("woj.geojson?v=16").then(r=>r.json()).then(gj=>{
  gj.features.forEach(f=>{
    const g=f.geometry,polys=g.type==="Polygon"?[g.coordinates]:g.coordinates;let b=[1e9,1e9,-1e9,-1e9];
    polys.forEach(p=>p[0].forEach(([x,y])=>{b[0]=Math.min(b[0],x);b[1]=Math.min(b[1],y);b[2]=Math.max(b[2],x);b[3]=Math.max(b[3],y);}));
    const k=Math.cos((b[1]+b[3])/2*Math.PI/180),s=Math.min(52/((b[2]-b[0])*k),44/(b[3]-b[1]));
    const d=polys.map(p=>"M"+p[0].filter((_,i)=>i%2===0).map(([x,y])=>((x-b[0])*k*s+1).toFixed(1)+" "+((b[3]-y)*s+1).toFixed(1)).join("L")+"Z").join("");
    WOJ[f.properties.nazwa]='<svg class="woj" viewBox="0 0 54 46"><path d="'+d+'"/></svg>';
  });
}).catch(()=>{}).finally(start);
